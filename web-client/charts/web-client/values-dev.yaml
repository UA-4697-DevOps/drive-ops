# Development environment values for web-client

replicaCount: 1

image:
  repository: web-client
  tag: local
  pullPolicy: Never

serviceAccount:
  create: true
  annotations: {}
  name: "web-client"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false

backend:
  driverServiceUrl: "http://driver-service.driver-service.svc.cluster.local:8082"

ingress:
  enabled: false

livenessProbe:
  httpGet:
    path: /health
    port: 8083
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8083
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
