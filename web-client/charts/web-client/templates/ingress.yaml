apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-client-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    # Infrastructure values below are populated by infra/scripts/populate-ingress-values.sh
    # after Terraform is applied. Run it once, then commit the updated manifest.
    #
    # How to retrieve values manually:
    #   ACM cert   : cd infra/terragrunt/envs/dev/acm && terragrunt output certificate_arn
    #   Subnets    : cd infra/terragrunt/envs/dev/shared-infra && terragrunt output public_subnet_ids
    #   ALB SG     : cd infra/terragrunt/envs/dev/shared-infra && terragrunt output sg_alb_id
    # ALB Configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # SSL/TLS Configuration — HTTP:80 is kept to enable the ssl-redirect action;
    # the ALB automatically returns 301 → HTTPS for any HTTP request.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-2:969283154407:certificate/48dd9e5e-6e92-4caa-88ab-95636766268c # From acm output: certificate_arn
    # Health Check (web-client nginx health endpoint)
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    # Network Configuration
    alb.ingress.kubernetes.io/subnets: subnet-0a0dcdc19a2f78e4d,subnet-0658bcf6b0175cad2 # From shared-infra output: public_subnet_ids (comma-separated)
    alb.ingress.kubernetes.io/security-groups: sg-0d93c034f6a242aa0 # From shared-infra output: sg_alb_id
    # Tags
    alb.ingress.kubernetes.io/tags: Environment=dev,ManagedBy=ArgoCD,Project=drive-ops,Service=web-client
    # Share the same ALB as client-gateway to save cost (grouped by ALB controller)
    alb.ingress.kubernetes.io/group.name: driveops-dev
    # External DNS annotation — apex domain for the user-facing web app
    external-dns.alpha.kubernetes.io/hostname: driveops.dmytrominochkin.cloud
spec:
  ingressClassName: alb
  rules:
  - host: driveops.dmytrominochkin.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "web-client.fullname" . }}
            port:
              number: 80
