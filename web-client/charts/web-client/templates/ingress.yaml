{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-client-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    # Infrastructure values below are populated via Helm values (values.yaml / ArgoCD parameters).
    # Set ingress.certificateArn, ingress.subnets, ingress.securityGroups,
    # ingress.groupName, ingress.host, and ingress.tags before deploying.
    #
    # How to retrieve values manually:
    #   ACM cert   : cd infra/terragrunt/envs/dev/acm && terragrunt output certificate_arn
    #   Subnets    : cd infra/terragrunt/envs/dev/shared-infra && terragrunt output public_subnet_ids
    #   ALB SG     : cd infra/terragrunt/envs/dev/shared-infra && terragrunt output sg_alb_id
    # ALB Configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # SSL/TLS Configuration — HTTP:80 is kept to enable the ssl-redirect action;
    # the ALB automatically returns 301 → HTTPS for any HTTP request.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn }}
    # Health Check (web-client nginx health endpoint)
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    # Network Configuration
    alb.ingress.kubernetes.io/subnets: {{ .Values.ingress.subnets }}
    alb.ingress.kubernetes.io/security-groups: {{ .Values.ingress.securityGroups }}
    # Tags
    alb.ingress.kubernetes.io/tags: {{ .Values.ingress.tags }}
    # Share the same ALB as client-gateway to save cost (grouped by ALB controller)
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.groupName }}
    # External DNS annotation — apex domain for the user-facing web app
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingress.host }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "web-client.fullname" . }}
            port:
              number: 80
{{- end }}
