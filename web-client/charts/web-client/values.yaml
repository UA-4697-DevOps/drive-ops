# ---------------------------------------------------------------------------
# Default values for web-client Helm chart.
# Override these in values-dev.yaml, values-prod.yaml, or via --set flags.
# ---------------------------------------------------------------------------

replicaCount: 1

image:
  repository: ""   # Set to ECR URI at deploy time: <account>.dkr.ecr.us-east-2.amazonaws.com/web-client
  tag: latest
  pullPolicy: IfNotPresent

# K8s Service
service:
  type: ClusterIP
  port: 8083

# Runtime environment — injected into the nginx container
env:
  DRIVER_SERVICE_URL: "http://driver-service:8082"

# Kyverno require-labels policy mandates these three labels on every Deployment.
labels:
  team: drive-ops
  env: dev
  service: web-client

# Resource requests/limits — required by Kyverno require-resources policy.
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

# Security context — Kyverno disallow-privileged policy requires privileged: false.
securityContext:
  privileged: false
  readOnlyRootFilesystem: false   # nginx needs to write temp/pid files
  allowPrivilegeEscalation: false
  runAsNonRoot: false             # nginx master must run as root; worker runs as nginx (101)

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: 8083
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8083
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Ingress (disabled by default — enable in environment-specific values)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: web-client.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
