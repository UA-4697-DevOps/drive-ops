<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DriveOps — Orders Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>DriveOps</h1>
      <span class="subtitle">Orders Dashboard</span>
      <div class="refresh-info">
        Auto-refresh: <span id="countdown">10</span>s
        <button id="refresh-btn" type="button" title="Refresh now" aria-label="Refresh">↻</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Drivers Section -->
    <section class="card">
      <div class="card-header">
        <h2>Drivers</h2>
        <span class="badge" id="drivers-count">—</span>
        <span class="status-dot" id="drivers-status"></span>
      </div>
      <div class="table-wrapper">
        <table id="drivers-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Phone</th>
              <th>Active</th>
            </tr>
          </thead>
          <tbody id="drivers-body">
            <tr><td colspan="5" class="loading">Loading drivers…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Trip Requests Section -->
    <section class="card">
      <div class="card-header">
        <h2>Trip Requests</h2>
        <span class="badge" id="trips-count">—</span>
        <span class="status-dot" id="trips-status"></span>
      </div>
      <div class="table-wrapper">
        <table id="trips-table">
          <thead>
            <tr>
              <th>Trip ID</th>
              <th>Passenger</th>
              <th>Origin</th>
              <th>Destination</th>
              <th>Status</th>
              <th>Driver</th>
            </tr>
          </thead>
          <tbody id="trips-body">
            <tr><td colspan="6" class="loading">Loading trip requests…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <span>DriveOps &copy; 2026</span>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
