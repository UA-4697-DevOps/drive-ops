basePath: /
definitions:
  domain.AssignDriverRequest:
    properties:
      driver_id:
        description: DriverID is validated in the service layer using domain.ErrInvalidID
        type: string
    type: object
  domain.Trip:
    properties:
      created_at:
        type: string
      driver_id:
        type: string
      dropoff:
        type: string
      id:
        type: string
      passenger_id:
        type: string
      pickup:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8081
info:
  contact:
    email: support@drive-ops.example.com
    name: Drive-Ops Team
  description: |-
    REST API for managing ride trips in Drive-Ops platform
    Handles trip creation, retrieval, driver assignment, and trip lifecycle management
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Trip Service API
  version: "1.0"
paths:
  /health:
    get:
      description: Returns service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /trips:
    post:
      consumes:
      - application/json
      description: Creates a new trip request with pickup and dropoff locations
      parameters:
      - description: Trip request payload
        in: body
        name: trip
        required: true
        schema:
          $ref: '#/definitions/domain.Trip'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Trip'
        "400":
          description: Invalid request body or missing required fields
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new trip
      tags:
      - trips
  /trips/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves trip details by its unique identifier
      parameters:
      - description: Trip UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Trip'
        "400":
          description: Invalid UUID format
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Trip not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get trip by ID
      tags:
      - trips
  /trips/{id}/assign-driver:
    patch:
      consumes:
      - application/json
      description: Assigns a driver to an existing trip and updates trip status
      parameters:
      - description: Trip UUID
        in: path
        name: id
        required: true
        type: string
      - description: Driver assignment payload
        in: body
        name: driver
        required: true
        schema:
          $ref: '#/definitions/domain.AssignDriverRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Driver assigned successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid UUID or request body
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Trip not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Trip is no longer available for assignment
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Assign driver to trip
      tags:
      - trips
schemes:
- http
- https
swagger: "2.0"
tags:
- description: Operations related to trip management
  name: trips
- description: Service health and readiness checks
  name: health
