services:
  postgres-test:
    image: postgres:15-alpine
    container_name: trip-service-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: trip_service_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d trip_service_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  trip-service-test:
    container_name: trip-service-container
    build:
      context: ../../
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - DB_URL=postgresql://testuser:testpass@postgres-test:5432/trip_service_test?sslmode=disable
      - TRIP_SERVICE_PORT=:8081
      - AWS_ACCESS_KEY_ID=mock
      - AWS_SECRET_ACCESS_KEY=mock
      - AWS_REGION=us-east-2
      - SQS_TRIP_CREATED_URL=http://mock-url
      - SQS_DRIVER_ASSIGNED_URL=http://mock-url
      - SQS_TRIP_COMPLETED_URL=http://mock-url
    depends_on:
      postgres-test:
        condition: service_healthy
