services:
  postgres-test:
    image: postgres:15-alpine
    container_name: trip-service-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: trip_service_test
    ports:
      - "5433:5432" # Host 5433 -> Container 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d trip_service_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  trip-service-test:
    build:
      context: ../../
      dockerfile: trip-service/Dockerfile
    ports:
      - "8081:8081" # Essential for TestHealthEndpoint
    environment:
      - DB_USER=testuser
      - DB_PASSWORD=testpass
      - DB_NAME=trip_service_test
      - DB_HOST=postgres-test
      - DB_PORT=5432
      # Mandatory SQS URLs to pass broker.LoadConfig() validation
      - SQS_TRIP_CREATED_URL=${SQS_TRIP_CREATED_URL:-https://sqs.us-east-2.amazonaws.com/969283154407/trip-created-dev.fifo}
      - SQS_DRIVER_ASSIGNED_URL=${SQS_DRIVER_ASSIGNED_URL:-https://sqs.us-east-2.amazonaws.com/969283154407/driver-assigned-dev.fifo}
      - SQS_TRIP_COMPLETED_URL=${SQS_TRIP_COMPLETED_URL:-https://sqs.us-east-2.amazonaws.com/969283154407/trip-completed-dev.fifo}
      # AWS Configuration for Local Testing
      - AWS_REGION=us-east-2
      - AWS_ACCESS_KEY_ID=testing
      - AWS_SECRET_ACCESS_KEY=testing
    depends_on:
      postgres-test:
        condition: service_healthy
