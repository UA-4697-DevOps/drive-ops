# Development environment values for trip-service

replicaCount: 1

image:
  repository: "{{ .Values.aws.accountId }}.dkr.ecr.{{ .Values.aws.region }}.amazonaws.com/trip-service"
  pullPolicy: Always
  tag: "f0b02799234b1845412a0d7ce58997829bd693b1"

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::{{ .Values.aws.accountId }}:role/Training-drive-ops-dev-trip-service-role"
  name: "trip-service"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

autoscaling:
  enabled: false

config:
  awsRegion: "{{ .Values.aws.region }}"
  sqsTripCreatedUrl: "https://sqs.{{ .Values.aws.region }}.amazonaws.com/{{ .Values.aws.accountId }}/trip-created-dev.fifo"
  sqsDriverAssignedUrl: "https://sqs.{{ .Values.aws.region }}.amazonaws.com/{{ .Values.aws.accountId }}/driver-assigned-dev.fifo"
  sqsTripCompletedUrl: "https://sqs.{{ .Values.aws.region }}.amazonaws.com/{{ .Values.aws.accountId }}/trip-completed-dev.fifo"
  servicePort: ":8081"

database:
  secretName: "trip-service-secrets"
  secretKey: "DB_URL"

# Simple health checks for test/dev
livenessProbe:
  httpGet:
    path: /health
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1  # Can tolerate downtime in dev
