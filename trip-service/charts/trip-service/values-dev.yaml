# Development environment values for trip-service

replicaCount: 1

image:
  repository: 969283154407.dkr.ecr.us-east-2.amazonaws.com/trip-service
  pullPolicy: Always
  tag: "f0b02799234b1845412a0d7ce58997829bd693b1"

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::969283154407:role/Training-drive-ops-dev-trip-service-role
  name: "trip-service"

resources:
  limits:
    cpu: 250m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 120
      selectPolicy: Min

# Pod scheduling rules for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    # Spread pods across different nodes (highest priority)
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: trip-service
        topologyKey: kubernetes.io/hostname
    # Spread pods across availability zones
    - weight: 50
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: trip-service
        topologyKey: topology.kubernetes.io/zone

# Pod disruption budget for voluntary disruptions (node drains, upgrades)
# With 1 replica, maxUnavailable: 0 means the pod cannot be evicted,
# ensuring availability during maintenance
podDisruptionBudget:
  enabled: true
  maxUnavailable: 0  # No pods can be unavailable (requires new pod before evicting old one)

config:
  awsRegion: "us-east-2"
  sqsTripCreatedUrl: "https://sqs.us-east-2.amazonaws.com/969283154407/trip-created-dev.fifo"
  sqsDriverAssignedUrl: "https://sqs.us-east-2.amazonaws.com/969283154407/driver-assigned-dev.fifo"
  sqsTripCompletedUrl: "https://sqs.us-east-2.amazonaws.com/969283154407/trip-completed-dev.fifo"
  servicePort: ":8081"

database:
  secretName: "trip-service-secrets"
  secretKey: "DB_URL"

# Health probes (standardized with platform)
startupProbe:
  httpGet:
    path: /health
    port: 8081
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 12  # 60 seconds total for startup
  timeoutSeconds: 5

livenessProbe:
  httpGet:
    path: /health
    port: 8081
  initialDelaySeconds: 30  # After startup succeeds
  periodSeconds: 15
  failureThreshold: 3      # 45 seconds before restart
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3      # 30 seconds before unready
  timeoutSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0  # Zero-downtime deployments (matches driver-service)

networkPolicy:
  enabled: true
