apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trip-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trip-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "trip-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trip-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trip-service.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "trip-service.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - name: {{ .Values.service.portName }}
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        # Database Configuration
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.secretName }}
              key: {{ .Values.database.secretKey }}
        # AWS Configuration
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: {{ include "trip-service.fullname" . }}-config
              key: aws-region
        # SQS Queue URLs
        - name: SQS_TRIP_CREATED_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "trip-service.fullname" . }}-config
              key: sqs-trip-created-url
        - name: SQS_DRIVER_ASSIGNED_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "trip-service.fullname" . }}-config
              key: sqs-driver-assigned-url
        - name: SQS_TRIP_COMPLETED_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "trip-service.fullname" . }}-config
              key: sqs-trip-completed-url
        # Service Port
        - name: TRIP_SERVICE_PORT
          value: {{ .Values.config.servicePort | quote }}
        # Health Probes
        {{- with .Values.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        # Resources
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        # Volume Mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
