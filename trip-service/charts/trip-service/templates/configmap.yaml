{{- if .Values.configMap.create -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trip-service.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trip-service.labels" . | nindent 4 }}
data:
  aws-region: {{ tpl .Values.config.awsRegion . | quote }}
  sqs-trip-created-url: {{ tpl .Values.config.sqsTripCreatedUrl . | quote }}
  sqs-driver-assigned-url: {{ tpl .Values.config.sqsDriverAssignedUrl . | quote }}
  sqs-trip-completed-url: {{ tpl .Values.config.sqsTripCompletedUrl . | quote }}
{{- end }}
