apiVersion: v1
kind: Service
metadata:
  name: {{ include "client-gateway.fullname" . }}
  labels:
    {{- include "client-gateway.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "client-gateway.labels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: {{ .Values.service.type }}
