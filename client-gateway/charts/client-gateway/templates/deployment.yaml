apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "client-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "client-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # Recreate ensures only one pod is running at a time — required for Telegram
  # long-polling (a single active getUpdates connection per bot).
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "client-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "client-gateway.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "client-gateway.serviceAccountName" . }}
      securityContext:
      # Define default pod security context with non-root user and seccomp profile
      {{- $podDefaults := dict "runAsNonRoot" true "seccompProfile" (dict "type" "RuntimeDefault") }}
      # Merge with user-provided values, overwriting defaults
      {{- mustMergeOverwrite (deepCopy $podDefaults) (.Values.podSecurityContext | default (dict)) | toYaml | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "client-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- $containerDefaults := dict "runAsNonRoot" true "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) "seccompProfile" (dict "type" "RuntimeDefault") }}
            {{- mustMergeOverwrite (deepCopy $containerDefaults) (.Values.securityContext | default (dict)) | toYaml | nindent 12 }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            {{- if or .Values.secret.create .Values.secret.existingSecretName }}
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "client-gateway.fullname" .)) .Values.secret.existingSecretName }}
                  key: bot-token
            {{- end }}
            - name: TRIP_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "client-gateway.fullname" . }}-config
                  key: trip-service-url
            - name: DRIVER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "client-gateway.fullname" . }}-config
                  key: driver-service-url
            - name: HEALTH_CHECK_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "client-gateway.fullname" . }}-config
                  key: health-check-port
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "client-gateway.fullname" . }}-config
                  key: debug
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: bot-logs
              mountPath: /app/bot/logs
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: bot-logs
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
