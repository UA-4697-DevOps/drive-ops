apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "client-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "client-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # Recreate ensures only one pod is running at a time — required for Telegram
  # long-polling (a single active getUpdates connection per bot).
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "client-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "client-gateway.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "client-gateway.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "client-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "client-gateway.fullname" . }}-secrets
                  key: bot-token
            - name: TRIP_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "client-gateway.fullname" . }}-config
                  key: trip-service-url
            - name: DRIVER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "client-gateway.fullname" . }}-config
                  key: driver-service-url
            - name: HEALTH_CHECK_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "client-gateway.fullname" . }}-config
                  key: health-check-port
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "client-gateway.fullname" . }}-config
                  key: debug
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: bot-logs
              mountPath: /app/bot/logs
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: bot-logs
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
