# Development environment values for client-gateway

replicaCount: 1

# Dev environment: image is pulled from ECR
# (969283154407.dkr.ecr.us-east-2.amazonaws.com/client-gateway).
# pullPolicy: Always — ensures the latest dev image is always pulled from ECR,
# preventing stale cached images on nodes when using a mutable tag (0.0.0-dev).
image:
  repository: 969283154407.dkr.ecr.us-east-2.amazonaws.com/client-gateway
  tag: "0.0.0-dev"
  pullPolicy: Always

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::969283154407:role/client-gateway-role
  name: "client-gateway"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false

backend:
  tripServiceUrl: "http://trip-service.trip-service.svc.cluster.local:8081"
  driverServiceUrl: "http://driver-service.driver-service.svc.cluster.local:8082"

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3

strategy:
  type: Recreate  # Required for Telegram long-polling single-instance constraint

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
  hosts:
    - host: driver.dev.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []