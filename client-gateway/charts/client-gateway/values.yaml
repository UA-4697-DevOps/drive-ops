replicaCount: 1

image:
  repository: 969283154407.dkr.ecr.us-east-2.amazonaws.com/client-gateway
  tag: "0.0.0-dev"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi

# MUST remain disabled — Telegram long-polling requires exactly one instance.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70

serviceAccount:
  iamRoleArn: arn:aws:iam::969283154407:role/client-gateway-role

backend:
  tripServiceUrl: "http://trip-service.dev.svc.cluster.local:8081"
  driverServiceUrl: "http://driver-service.dev.svc.cluster.local:8082"

config:
  healthCheckPort: "8080"
  debug: "false"

bot:
  token: ""

ingress:
  enabled: false
  className: ""
  host: ""
  path: /
  annotations: {}
  tls: []
