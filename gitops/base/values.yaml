replicaCount: 1

image:
  repository: ""  # auto-populated by CI via yq (aws sts + vars.AWS_REGION)
  pullPolicy: IfNotPresent
  tag: "none"     # never use latest — always explicit sha

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  annotations: {}

env:
  LOG_LEVEL: "info"
