replicaCount: 1

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: "none"

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  iamRoleArn: ""  # chart reads iamRoleArn, not annotations

env:
  LOG_LEVEL: "info"

externalSecret:
  secretPath: ""  # overridden per environment via ArgoCD parameters
