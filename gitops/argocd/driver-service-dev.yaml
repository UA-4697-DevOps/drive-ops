apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: driver-service-dev
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.slack: devops-alerts
spec:
  project: drive-ops
  source:
    repoURL: https://github.com/UA-4697-DevOps/drive-ops.git
    targetRevision: main
    path: driver-service/charts
    helm:
      valueFiles:
        - ../../gitops/base/values.yaml
        - ../../gitops/overlays/dev/values.yaml
      parameters:
        - name: externalSecret.secretPath
          value: drive-ops/dev/rds/credentials
  destination:
    server: https://kubernetes.default.svc
    namespace: driver-service-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
