apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: client-gateway-dev
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.slack: devops-alerts
spec:
  project: drive-ops
  source:
    repoURL: https://github.com/UA-4697-DevOps/drive-ops.git
    targetRevision: main
    # Raw k8s manifests — no Helm, no Kustomize
    path: infra/k8s/apps/client-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: client-gateway
  syncPolicy:
    # Automated sync is intentionally disabled until all placeholder values in
    # infra/k8s/apps/client-gateway/ingress.yaml (ACM cert ARN, public subnet IDs, ALB SG ID)
    # and infra/k8s/apps/client-gateway/serviceaccount.yaml (IRSA role ARN) have been
    # populated by running infra/scripts/populate-client-gateway-ingress.sh after
    # Terraform apply, and the updated manifests have been committed to the repo.
    # Re-enable by adding: automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
