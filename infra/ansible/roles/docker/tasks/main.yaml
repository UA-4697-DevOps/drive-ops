---
# Tasks for Docker Engine installation and configuration

- name: Install general development utilities
  ansible.builtin.apt:
    name:
      - git
      - vim
      - htop
      - net-tools
    state: present
  tags: [ docker, tools ]

- name: Install Docker-specific prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
    state: present
  tags: prerequisites

- name: Create directory for Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: docker

- name: Add Docker GPG key using native module
  # FIXED: Dynamically selects ubuntu or debian based on system facts
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.gpg
    mode: '0644'
  tags: docker

- name: Add Docker repository using native module
  # FIXED: Uses ansible_facts to avoid deprecation warnings and correctly sets the repo URL
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }} stable"
    filename: docker
    state: present
  tags: docker

- name: Update apt cache after adding Docker repo
  ansible.builtin.apt:
    update_cache: yes
  tags: docker

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  tags: docker

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users }}"
  tags: docker

- name: Start and enable Docker service (Skip on WSL)
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes
  when: ansible_facts['service_mgr'] == 'systemd'
  tags: docker

- name: Install Python Docker SDK
  ansible.builtin.apt:
    name: python3-docker
    state: present
  tags: docker

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false
  tags: verify

