---
# Tasks for Docker Engine installation and configuration

- name: Install general development utilities
  # FIXED: Split into a separate task to avoid misleading names
  ansible.builtin.apt:
    name:
      - git
      - vim
      - htop
      - net-tools
    state: present
  tags: [ docker, tools ]

- name: Install Docker-specific prerequisites
  # FIXED: Keeping only essential packages for Docker's apt repository
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
    state: present
  tags: prerequisites

- name: Create directory for Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: docker

- name: Add Docker GPG key using native module
  # FIXED: Replaced 'shell' with 'get_url' for better error handling and idempotency
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.gpg
    mode: '0644'
  tags: docker

- name: Add Docker repository using native module
  # FIXED: Replaced 'shell' with 'apt_repository' for idiomatic Ansible usage
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
  tags: docker

- name: Update apt cache after adding Docker repo
  ansible.builtin.apt:
    update_cache: yes
  tags: docker

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  tags: docker

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users }}"
  tags: docker

- name: Start and enable Docker service (Skip on WSL)
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes
  when: ansible_service_mgr == 'systemd'
  tags: docker

- name: Install Python Docker SDK
  ansible.builtin.apt:
    name: python3-docker
    state: present
  tags: docker

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false
  tags: verify
