---
# Tasks to deploy Client Gateway (Python Bot) using central configuration

- name: Create project root directory
  ansible.builtin.file:
    path: "/opt/drive-ops"
    state: directory
    mode: '0755'

- name: Copy central .env file
  ansible.builtin.copy:
    src: "../../../../../.env"
    dest: "/opt/drive-ops/.env"
    mode: '0600'

- name: Copy central docker-compose.yml
  ansible.builtin.copy:
    src: "../../../../../docker-compose.yml"
    dest: "/opt/drive-ops/docker-compose.yml"

- name: Sync client-gateway source code
  # Required because docker-compose uses 'build' context
  ansible.builtin.copy:
    src: "../../../../../client-gateway/"
    dest: "/opt/drive-ops/client-gateway/"

- name: Start Client Gateway service only
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    # This ensures only the bot is managed by this role
    services:
      - "client-gateway"
    build: always
