---
# 1. Verify if .env exists
- name: Check if .env file exists
  ansible.builtin.stat:
    path: "/vagrant/.env"
  register: env_file
  tags: infrastructure

# 2. Fail if .env is missing
- name: Fail if .env file is missing
  ansible.builtin.fail:
    msg: "ERROR: .env file is missing! Please copy .env.example to .env and set your credentials."
  when: not env_file.stat.exists
  tags: infrastructure

# 3. Pull/Build and Start everything defined in docker-compose.yml
- name: Start the entire drive-ops stack
  community.docker.docker_compose_v2:
    project_src: "/vagrant"
    state: present
    build: always
    wait: yes
  tags: docker
  
