---
# 1. Verify the existence of the global .env file in the project root
- name: Check if .env file exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../../.env"
  register: env_file
  tags: infrastructure

# 2. Halt execution if the file is missing (Fail-Fast pattern)
- name: Fail if .env file is missing
  ansible.builtin.fail:
    msg: |
      The global .env file is missing! 
      Please copy .env.example to .env in the project root and include:
      - Database credentials
      - RabbitMQ credentials
      - BOT_TOKEN
  when: not env_file.stat.exists
  tags: infrastructure

# 3. Deploy the entire drive-ops stack via Docker Compose
- name: Deploy the entire drive-ops stack via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ playbook_dir }}/../../../"
    state: present
    build: missing
    wait: yes
  tags: docker
  
