---
# Tasks for Client Gateway (Python-based Telegram Bot)

- name: Link client-gateway source code (Flexible Environment)
  # Links Python source code to the project root for development hot-reloading
  # Redundant directory creation is skipped as it is handled by the 'infra' role
  ansible.builtin.file:
    src: "{{ drive_ops_src_root }}/client-gateway"
    dest: "/opt/drive-ops/client-gateway"
    state: link
    force: yes
  tags: [ app, gateway ]

- name: Start Client Gateway service
  # Deploys the Telegram bot container via Docker Compose
  # Uses the centralized build strategy to optimize deployment time
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    services:
      - "client-gateway"
    build: "{{ docker_build_strategy | default('policy') }}"
  tags: [ app, gateway ]
