---
# Tasks for Client Gateway (Python-based Telegram Bot)

- name: Link client-gateway source code (Flexible Environment)
  # FIXED: Removed redundant directory creation as it's handled by the 'infra' role
  # FIXED: Replaced hardcoded /vagrant with a variable for better portability (CI/CD, Prod)
  ansible.builtin.file:
    src: "{{ drive_ops_src_root }}/client-gateway"
    dest: "/opt/drive-ops/client-gateway"
    state: link
    force: yes
  tags: [ infrastructure, gateway ]

- name: Start Client Gateway service
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    services:
      - "client-gateway"
    # FIXED: Using a variable for build policy to avoid unnecessary rebuilds
    build: "{{ docker_build_strategy | default('policy') }}"
  tags: [ infrastructure, gateway ]
