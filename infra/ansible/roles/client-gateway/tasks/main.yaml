---
# Tasks for Client Gateway (Python-based Telegram Bot)

- name: Ensure project root directory exists
  ansible.builtin.file:
    path: "/opt/drive-ops"
    state: directory
    mode: '0755'
  tags: [ infrastructure, gateway ]

- name: Link client-gateway source code (Developer Mode)
  # Creating a symlink to /vagrant to enable hot-reloading in Docker
  # Fixed: No more redundant copying of shared .env files here
  ansible.builtin.file:
    src: "/vagrant/client-gateway"
    dest: "/opt/drive-ops/client-gateway"
    state: link
    force: yes
  tags: [ infrastructure, gateway ]

- name: Start Client Gateway service
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    services:
      - "client-gateway"
    build: always
  tags: [ infrastructure, gateway ]
