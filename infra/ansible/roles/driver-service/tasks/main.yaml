---
# Tasks for Driver Service (Python/FastAPI)

- name: Start driver-service and migrations
  # Orchestrates migration and main service
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    services:
      - "driver-migrations"
      - "driver-service"
    build: "{{ docker_build_strategy | default('always') }}"
  tags: [ app, driver ]
