---
# Tasks for Trip Service (Go-based microservice)

- name: Ensure project root directory exists
  ansible.builtin.file:
    path: "/opt/drive-ops"
    state: directory
    mode: '0755'
  tags: [ infrastructure, trip ]

- name: Link trip-service source code (Developer Mode)
  # Using symlinks instead of copy for instant code updates from host to VM
  # This addresses peer review feedback regarding slow development iterations
  ansible.builtin.file:
    src: "/vagrant/trip-service"
    dest: "/opt/drive-ops/trip-service"
    state: link
    force: yes
  tags: [ infrastructure, trip ]

- name: Start trip-service and migrations
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    services:
      - "trip-migrations"
      - "trip-service"
    build: always
  tags: [ infrastructure, trip ]
