---
# Main tasks for Trip Service deployment using centralized configuration

- name: Ensure project root directory exists
  ansible.builtin.file:
    path: "/opt/drive-ops"
    state: directory
    mode: '0755'
  tags: [ infrastructure, trip ]

- name: Copy central .env file (Secure permissions)
  # Fixed as per CodeRabbitAI: Using playbook_dir for stability and 0600 for security
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../.env"
    dest: "/opt/drive-ops/.env"
    mode: '0600'
  tags: [ infrastructure, trip ]

- name: Copy central docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker-compose.yml"
    dest: "/opt/drive-ops/docker-compose.yml"
    mode: '0644'
  tags: [ infrastructure, trip ]

- name: Sync trip-service source code
  # Using playbook_dir to avoid fragile relative paths
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../trip-service/"
    dest: "/opt/drive-ops/trip-service/"
    mode: '0644'
  tags: [ infrastructure, trip ]

- name: Start trip-service and migrations only
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    services:
      - "trip-migrations"
      - "trip-service"
    build: always
  tags: [ infrastructure, trip ]
