---
# Main tasks for Shared Infrastructure (DB, MQ, and Common Configs)

- name: Create project root directory
  ansible.builtin.file:
    path: "/opt/drive-ops"
    state: directory
    mode: '0755'
  tags: [ infrastructure, infra ]

- name: Copy central .env file
  # Single source of truth for microservices secrets
  # Secure permissions (0600) ensure only the owner can access sensitive data
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../.env"
    dest: "/opt/drive-ops/.env"
    mode: '0600'
  tags: [ infrastructure, infra ]

- name: Copy central docker-compose.yml
  # Global orchestration file for the drive-ops stack
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker-compose.yml"
    dest: "/opt/drive-ops/docker-compose.yml"
    mode: '0644'
  tags: [ infrastructure, infra ]

- name: Ensure postgres init directory exists
  # Matches the volume mount path: ./infra/postgres/init-db
  ansible.builtin.file:
    path: "/opt/drive-ops/infra/postgres/init-db"
    state: directory
    mode: '0755'
  tags: [ infrastructure, infra ]

- name: Copy postgres init scripts
  # FIXED: Relative path adjusted to locate init.sql based on project structure
  # This script initializes driver_db upon first container startup
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../postgres/init-db/init.sql"
    dest: "/opt/drive-ops/infra/postgres/init-db/init.sql"
    mode: '0644'
  tags: [ infrastructure, infra ]

- name: Start database and message broker only
  # FIXED: Using YAML service keys ('db', 'mq') instead of container names
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    services: 
      - "db"
      - "mq"
  tags: [ infrastructure, infra ]

- name: Wait for infrastructure readiness
  # Health checks to prevent dependent services from crashing on startup
  # Waits for PostgreSQL (5432) and RabbitMQ (5672) to accept connections
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ item }}"
    state: started
    delay: 5
    timeout: 60
  loop: [ 5432, 5672 ]
  tags: [ infrastructure, infra ]
