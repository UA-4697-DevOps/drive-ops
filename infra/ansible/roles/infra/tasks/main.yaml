---
# Main tasks for Shared Infrastructure (Database and Configs)

- name: Create symlink for project root
  # Links the entire project from host to /opt/drive-ops for instant sync
  ansible.builtin.file:
    src: "{{ drive_ops_src_root }}"
    dest: "/opt/drive-ops"
    state: link
    force: yes
  tags: infra

- name: Set permissions for .env file
  # Set to 644 to ensure container access
  ansible.builtin.file:
    path: "/opt/drive-ops/.env"
    mode: '0644'
  tags: infra

- name: Start shared infrastructure services
  # [FINALIZED] Launches only the DB service. RabbitMQ (mq) is decommissioned.
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    services: ["db"]
  tags: infra

- name: Wait for database readiness
  # [FINALIZED] Removed port 5672 to prevent timeout failures in CI/CD.
  ansible.builtin.wait_for:
    host: localhost
    port: 5432
    state: started
    delay: 5
    timeout: 60
  tags: infra
