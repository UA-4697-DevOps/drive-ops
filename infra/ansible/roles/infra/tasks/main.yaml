---
# Main tasks for Shared Infrastructure (Database, Message Broker, and Configs)

- name: Create symlink for project root
  # Links the entire project from host to /opt/drive-ops for instant sync
  ansible.builtin.file:
    src: "{{ drive_ops_src_root }}"
    dest: "/opt/drive-ops"
    state: link
    force: yes
  tags: infra

- name: Set permissions for .env file
  # Set to 644 per colleague's request to ensure container access
  ansible.builtin.file:
    path: "/opt/drive-ops/.env"
    mode: '0644'
  tags: infra

- name: Ensure LocalStack init script is executable
  # [NEW] Critical: The script must be executable for LocalStack to run it on boot
  ansible.builtin.file:
    path: "/opt/drive-ops/infra/localstack/init-sqs.sh"
    mode: '0755'
  tags: infra

- name: Start shared infrastructure services
  # Launches core services using the live docker-compose.yml
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    # [CHANGED] Added localstack to the list
    services: ["db", "mq", "localstack"]
  tags: infra

- name: Wait for infrastructure readiness
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ item }}"
    state: started
    delay: 5
    timeout: 60
  # [CHANGED] Added 4566 (SQS) to the wait list
  loop: [ 5432, 5672, 4566 ]
  tags: infra
