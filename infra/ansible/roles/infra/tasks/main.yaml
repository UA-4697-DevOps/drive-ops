---
# Main tasks for Shared Infrastructure (Database, Message Broker, and Configs)

- name: Create symlink for project root
  # Links the entire project from host to /opt/drive-ops for instant sync
  ansible.builtin.file:
    src: "{{ drive_ops_src_root }}"
    dest: "/opt/drive-ops"
    state: link
    force: yes
  tags: infra

- name: Set permissions for .env file
  # Set to 644 to ensure container access
  ansible.builtin.file:
    path: "/opt/drive-ops/.env"
    mode: '0644'
  tags: infra

- name: Start shared infrastructure services
  # Launches core services using the live docker-compose.yml
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    services: ["db", "mq"]
  tags: infra

- name: Wait for infrastructure readiness
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ item }}"
    state: started
    delay: 5
    timeout: 60
  loop: [ 5432, 5672 ]
  tags: infra
