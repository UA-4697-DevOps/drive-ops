---
# Tasks to deploy shared infrastructure (DB and MQ)

- name: Create project root directory
  ansible.builtin.file:
    path: "/opt/drive-ops"
    state: directory
    mode: '0755'
  tags: [ infrastructure, infra ]

- name: Copy central .env file
  # Fixed: Using playbook_dir for stable paths and 0600 for secret security
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../.env"
    dest: "/opt/drive-ops/.env"
    mode: '0600'
  tags: [ infrastructure, infra ]

- name: Copy central docker-compose.yml
  # Fixed: Explicit mode 0644 and playbook_dir as recommended by CodeRabbitAI
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker-compose.yml"
    dest: "/opt/drive-ops/docker-compose.yml"
    mode: '0644'
  tags: [ infrastructure, infra ]

- name: Ensure postgres init directory exists
  ansible.builtin.file:
    path: "/opt/drive-ops/infra/postgres/init-db"
    state: directory
    mode: '0755'
  tags: [ infrastructure, infra ]

- name: Copy postgres init scripts
  # Fixed: Reliable path to init.sql and explicit permissions
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../infra/postgres/init-db/init.sql"
    dest: "/opt/drive-ops/infra/postgres/init-db/init.sql"
    mode: '0644'
  tags: [ infrastructure, infra ]

- name: Start database and message broker only
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    services:
      - "db"
      - "mq"
  tags: [ infrastructure, infra ]
  
