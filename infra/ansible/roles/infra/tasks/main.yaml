---
# Tasks to deploy shared infrastructure (DB and MQ)

- name: Create project root directory
  ansible.builtin.file:
    path: "/opt/drive-ops"
    state: directory
    mode: '0755'
  tags: [ infra ]

- name: Copy central .env file
  ansible.builtin.copy:
    src: "../../../../../.env"
    dest: "/opt/drive-ops/.env"
    mode: '0600'
  tags: [ infra ]

- name: Copy infrastructure docker-compose
  ansible.builtin.copy:
    src: "../../../../../docker-compose.yml"
    dest: "/opt/drive-ops/docker-compose.yml"
  tags: [ infra ]

- name: Start shared infrastructure
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    wait: yes
  tags: [ infra ]
