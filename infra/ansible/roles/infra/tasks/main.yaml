---
# Main tasks for Shared Infrastructure (DB, MQ, and Common Configs)

- name: Create project root directory
  ansible.builtin.file:
    path: "/opt/drive-ops"
    state: directory
    mode: '0755'
  tags: [ infrastructure, infra ]

- name: Copy central .env file (Secure permissions)
  # Centralized here to avoid duplication in service roles
  # Using 0600 mode to protect sensitive tokens and passwords
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../.env"
    dest: "/opt/drive-ops/.env"
    mode: '0600'
  tags: [ infrastructure, infra ]

- name: Copy central docker-compose.yml
  # Shared orchestration file for all services
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker-compose.yml"
    dest: "/opt/drive-ops/docker-compose.yml"
    mode: '0644'
  tags: [ infrastructure, infra ]

- name: Ensure postgres init directory exists
  ansible.builtin.file:
    path: "/opt/drive-ops/infra/postgres"
    state: directory
    mode: '0755'
  tags: [ infrastructure, infra ]

- name: Copy postgres init scripts
  # Handles multi-db initialization (trip_db and driver_db)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/infra/files/init.sql"
    dest: "/opt/drive-ops/infra/postgres/init.sql"
    mode: '0644'
  tags: [ infrastructure, infra ]

- name: Start database and message broker only
  community.docker.docker_compose_v2:
    project_src: "/opt/drive-ops"
    state: present
    services:
      - "drive-ops-db"
      - "drive-ops-mq"
  tags: [ infrastructure, infra ]
