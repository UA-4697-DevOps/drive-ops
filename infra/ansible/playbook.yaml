---
# Playbook to prepare environment for Drive-Ops services
# Target group 'local_vm' is used for explicit and safer targeting per peer review
- name: Prepare Local VM for Independent Docker services
  hosts: local_vm
  become: true
  gather_facts: true
  
  vars:
    # Default source root for Vagrant, can be overridden for CI/CD, Prod, or WSL
    drive_ops_src_root: "/vagrant"
    # Strategy for docker builds (always, missing, or policy)
    # Using 'always' for development to ensure code updates are reflected
    docker_build_strategy: "always"
    # Managing permissions for both the vagrant user and current system user
    docker_users:
      - vagrant
      - "{{ ansible_user_id }}"
  
  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: always
    
    - name: Install general system dependencies
      ansible.builtin.apt:
        name:
          - python3-pip
          - build-essential
          - dkms
          - curl
        state: present
      tags: always

    - name: Install kernel headers (Skip on WSL)
      # WSL 2 kernels are customized by Microsoft and don't use standard apt headers.
      # This task correctly runs on Vagrant but skips on WSL environments.
      ansible.builtin.apt:
        name: "linux-headers-{{ ansible_kernel }}"
        state: present
      when: "'microsoft' not in ansible_kernel | lower"
      tags: always

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
      tags: upgrade

  roles:
    # 1. Base Docker Engine installation using native Ansible modules
    - { role: docker, tags: [ docker ] }

    # 2. Shared Infrastructure (DB, MQ, and Centralized Configs)
    # Handles shared files once to ensure a single source of truth
    - { role: infra, tags: [ infrastructure, infra ] }

    # 3. Independent Services (Microservices stack)
    # Now using variables for flexible source paths and build strategies
    - { role: trip-service, tags: [ infrastructure, trip ] }
    - { role: client-gateway, tags: [ infrastructure, gateway ] }
    - { role: driver-service, tags: [ infrastructure, driver ] }

  post_tasks:
    - name: Print completion message
      ansible.builtin.debug:
        msg: 
          - "========================================"
          - " Infrastructure is ready!"
          - " Target group: {{ ansible_limit | default('local_vm') }}"
          - " Source root: {{ drive_ops_src_root }}"
          - " Deployment of {{ ansible_run_tags | default(['all']) | join(', ') }} completed!"
          - "========================================"
      tags: always
