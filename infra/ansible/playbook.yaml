---
# Playbook to prepare environment for Drive-Ops services
# Fixed: Targeting 'local_vm' specifically instead of 'all' for safety and clarity
- name: Prepare Local VM for Independent Docker services
  hosts: local_vm
  become: true
  gather_facts: true
  
  vars:
    # Adding current user and vagrant to docker group for permission management
    docker_users:
      - vagrant
      - "{{ ansible_user_id }}"
  
  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: always
    
    - name: Install general system dependencies
      ansible.builtin.apt:
        name:
          - python3-pip
          - build-essential
          - dkms
          - curl
        state: present
      tags: always

    - name: Install kernel headers (Skip on WSL)
      # WSL 2 uses a custom Microsoft kernel; standard headers are unavailable in apt
      # This task runs on Vagrant/Real VM but skips on WSL environments
      ansible.builtin.apt:
        name: "linux-headers-{{ ansible_kernel }}"
        state: present
      when: "'microsoft' not in ansible_kernel | lower"
      tags: always

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
      tags: upgrade

  roles:
    # 1. Base Docker Engine installation
    - { role: docker, tags: [ docker ] }

    # 2. Shared Infrastructure (DB, MQ, and Centralized Configs)
    # This role now handles the single source of truth for .env and docker-compose
    - { role: infra, tags: [ infrastructure, infra ] }

    # 3. Independent Services (Microservices stack)
    # Linked via symlinks to /vagrant for instant code updates during development
    - { role: trip-service, tags: [ infrastructure, trip ] }
    - { role: client-gateway, tags: [ infrastructure, gateway ] }
    - { role: driver-service, tags: [ infrastructure, driver ] }

  post_tasks:
    - name: Print completion message
      ansible.builtin.debug:
        msg: 
          - "========================================"
          - " Infrastructure is ready!"
          - " Target group: {{ ansible_limit | default('local_vm') }}"
          - " Deployment of {{ ansible_run_tags | default(['all']) | join(', ') }} completed!"
          - "========================================"
      tags: always
