---
- name: Prepare Debian VM for Independent Docker services
  hosts: all
  become: true
  gather_facts: true
  
  vars:
    docker_users:
      - vagrant
  
  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: always
    
    - name: Install general system dependencies
      ansible.builtin.apt:
        name:
          - python3-pip
          - build-essential
          - dkms
          - curl
        state: present
      tags: always

    - name: Install kernel headers (Skip on WSL)
      # Fixed: Microsoft WSL kernels don't have standard apt headers.
      # This task runs on Vagrant/Real VM but skips on WSL.
      ansible.builtin.apt:
        name: "linux-headers-{{ ansible_kernel }}"
        state: present
      when: "'microsoft' not in ansible_kernel | lower"
      tags: always

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
      tags: upgrade

  roles:
    # 1. Base Docker installation (Runs by default, skip with --skip-tags docker)
    - { role: docker, tags: [ docker ] }

    # 2. Shared Infrastructure (DB & MQ)
    - { role: infra, tags: [ infrastructure, infra ] }

    # 3. Independent Services (Microservices stack)
    - { role: trip-service, tags: [ infrastructure, trip ] }
    - { role: client-gateway, tags: [ infrastructure, gateway ] }
    - { role: driver-service, tags: [ infrastructure, driver ] }

  post_tasks:
    - name: Print completion message
      ansible.builtin.debug:
        msg: 
          - "========================================"
          - " VM is configured and ready!"
          - " Deployment of {{ ansible_run_tags | default(['all']) | join(', ') }} completed!"
          - "========================================"
      tags: always
