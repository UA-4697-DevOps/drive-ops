---
- name: Prepare Debian VM for Independent Docker services
  hosts: local_vm
  become: true
  gather_facts: true
  
  vars:
    docker_users:
      - vagrant
  
  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: always
    
    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      tags: upgrade

  roles:
    # 1. Base Docker installation (Only when explicitly called)
    - { role: docker, tags: [ docker ] }

    # 2. Shared Infrastructure (DB & MQ)
    - { role: infra, tags: [ infra ] }

    # 3. Independent Services (Each manages its part of the central compose)
    - { role: trip-service, tags: [ trip ] }
    - { role: client-gateway, tags: [ gateway ] }
    - { role: driver-service, tags: [ driver ] }

  post_tasks:
    - name: Print completion message
      debug:
        msg: 
          - "========================================"
          - " VM is configured and ready!"
          - " Deployment of {{ ansible_run_tags | join(', ') }} completed!"
          - "========================================"
      tags: always
