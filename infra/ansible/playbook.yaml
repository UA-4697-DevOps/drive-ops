---
# Playbook to prepare environment for Drive-Ops services
# Target group 'local_vm' ensures explicit targeting per peer review
- name: Prepare Local VM for Independent Docker services
  hosts: local_vm
  become: true
  gather_facts: true
  
  vars:
    # Default source root for Vagrant, can be overridden for CI/CD, Prod, or WSL
    drive_ops_src_root: "/vagrant"
    # Build strategy: 'always' for dev hot-reloads, 'policy' for stable environments
    docker_build_strategy: "always"
    # Deduplicating user list using Jinja2 'unique' filter to avoid redundant entries
    docker_users: "{{ (['vagrant', ansible_user_id]) | unique }}"

    # System packages to be installed
    system_packages:
      - python3-pip
      - build-essential
      - dkms
      - curl
      - git
      - vim
      - htop
      - net-tools
  
  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: always
    
    - name: Install general system dependencies and utilities
      ansible.builtin.apt:
        name: "{{ system_packages }}"
        state: present
      tags: always

    - name: Install kernel headers (Skip on WSL)
      ansible.builtin.apt:
        name: "linux-headers-{{ ansible_kernel }}"
        state: present
      when: "'microsoft' not in ansible_kernel | lower"
      tags: always

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
      tags: upgrade

  roles:
    # 1. Base Docker Engine installation with dearmored keys and arch mapping
    - { role: docker, tags: [ docker ] }

    # 2. Shared Infrastructure (PostgreSQL and Centralized Configs)
    # [FINALIZED] MQ removed from infra description to match Clean Slate logic
    - { role: infra, tags: [ infra ] }

    # 3. Independent Services (Microservices stack)
    - { role: trip-service, tags: [ app, trip ] }
    - { role: client-gateway, tags: [ app, gateway ] }
    - { role: driver-service, tags: [ app, driver ] }

  post_tasks:
    - name: Print completion message
      ansible.builtin.debug:
        msg: 
          - "========================================"
          - " Infrastructure is ready!"
          - " Architecture: AWS SQS FIFO Unified Bus"
          - " Target group: {{ ansible_limit | default('local_vm') }}"
          - " Source root: {{ drive_ops_src_root }}"
          - " Users added to docker group: {{ docker_users | join(', ') }}"
          - " Deployment of {{ ansible_run_tags | default(['all']) | join(', ') }} completed!"
          - "========================================"
      tags: always
