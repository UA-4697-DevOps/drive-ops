---
- name: Prepare Debian VM for Independent Docker services
  hosts: all
  become: true
  gather_facts: true
  
  vars:
    docker_users:
      - vagrant
  
  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: always
    
    - name: Install system dependencies (Moved from Vagrant shell)
      # Mentor's advice: use Ansible to install build tools
      ansible.builtin.apt:
        name:
          - python3-pip
          - linux-headers-{{ ansible_kernel }}
          - build-essential
          - dkms
          - curl
        state: present
      tags: always

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
      tags: upgrade

  roles:
    # 1. Base Docker installation 
    # Fixed: Clarified that this runs by default unless skipped (e.g., --skip-tags docker)
    - { role: docker, tags: [ docker ] }

    # 2. Shared Infrastructure (DB & MQ)
    # Standardized: Added 'infrastructure' master tag
    - { role: infra, tags: [ infrastructure, infra ] }

    # 3. Independent Services (Using centralized docker-compose)
    # Standardized: All services are now part of 'infrastructure' tag
    - { role: trip-service, tags: [ infrastructure, trip ] }
    - { role: client-gateway, tags: [ infrastructure, gateway ] }
    - { role: driver-service, tags: [ infrastructure, driver ] }

  post_tasks:
    - name: Print completion message
      ansible.builtin.debug:
        msg: 
          - "========================================"
          - " VM is configured and ready!"
          # Fixed as per CodeRabbitAI: Show 'all' if no specific tags were used
          - " Deployment of {{ ansible_run_tags | default(['all']) | join(', ') }} completed!"
          - "========================================"
      tags: always
