---
- name: Deploy TripService to VM
  hosts: local_vm
  become: no  
  vars:
    app_path: "/vagrant"

  tasks:

    - name: Build and Start containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_path }}"
        state: present
        build: always 
        services:
          - trip-service
      register: deploy_status

    - name: Show status
      debug:
        msg: "TripService is up and running!"
      when: deploy_status.changed