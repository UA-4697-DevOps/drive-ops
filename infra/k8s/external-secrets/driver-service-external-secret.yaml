---
---
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: driver-service-external-secret
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: driver-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: drive-ops/dev/driver-service
        property: DB_USER
    - secretKey: database-password
      remoteRef:
        key: drive-ops/dev/driver-service
        property: DB_PASSWORD
    - secretKey: database-endpoint
      remoteRef:
        key: drive-ops/dev/driver-service
        property: RDS_ENDPOINT
