---
---
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: driver-service-external-secret
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: driver-service-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .DB_USER }}:{{ .DB_PASSWORD }}@{{ .RDS_ENDPOINT }}/driver_db"
  data:
    - secretKey: DB_USER
      remoteRef:
        key: drive-ops/dev/driver-service
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: drive-ops/dev/driver-service
        property: DB_PASSWORD
    - secretKey: RDS_ENDPOINT
      remoteRef:
        key: drive-ops/dev/driver-service
        property: RDS_ENDPOINT
