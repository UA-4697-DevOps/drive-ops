apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drive-ops-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/UA-4697-DevOps/drive-ops.git
    targetRevision: feat/argo-cd
    path: infra/k8s/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
