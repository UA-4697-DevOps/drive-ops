apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-client
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/UA-4697-DevOps/drive-ops.git
    targetRevision: HEAD
    path: web-client/charts/web-client
  destination:
    server: https://kubernetes.default.svc
    namespace: web-client
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
