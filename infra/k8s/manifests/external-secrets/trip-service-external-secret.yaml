apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trip-service-external-secret
  namespace: trip-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: trip-service-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_URL: "postgresql://{{ .DB_USER }}:{{ .DB_PASSWORD }}@{{ .RDS_ENDPOINT }}/trip_db"
  data:
    - secretKey: DB_USER
      remoteRef:
        key: drive-ops/dev/trip-service
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: drive-ops/dev/rds/credentials
        property: password
    - secretKey: RDS_ENDPOINT
      remoteRef:
        key: drive-ops/dev/trip-service
        property: RDS_ENDPOINT
