# Canonical ExternalSecret for driver-service-secrets.
# Keep a single writer for this target Secret to avoid ESO ownership conflicts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: driver-service-secrets
  namespace: driver-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: driver-service-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .DB_USER | urlquery }}:{{ .DB_PASSWORD | urlquery }}@{{ .RDS_ENDPOINT }}/driver_db"
  data:
    - secretKey: DB_USER
      remoteRef:
        key: drive-ops/dev/rds/credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: drive-ops/dev/rds/credentials
        property: password
    - secretKey: RDS_ENDPOINT
      remoteRef:
        key: drive-ops/dev/driver-service
        property: RDS_ENDPOINT
