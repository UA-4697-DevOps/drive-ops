apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
spec:
  validationFailureAction: Enforce
  rules:
    - name: deny-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
      exclude:
        any:
          - resources:
              namespaces:
                - ingress-nginx
                - argocd
      validate:
        message: >-
          Privileged containers are not allowed.
        anyPattern:
          - spec:
              containers:
                - securityContext:
                    privileged: "false"
          - spec:
              template:
                spec:
                  containers:
                    - securityContext:
                        privileged: "false"
