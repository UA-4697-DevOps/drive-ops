---
# Allow ingress to trip-service only from client-gateway namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trip-service-ingress-from-client-gateway
  namespace: trip-service
spec:
  podSelector:
    matchLabels:
      app: trip-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: client-gateway
          podSelector:
            matchLabels:
              app: client-gateway
      ports:
        - protocol: TCP
          port: 8081
---
# Allow egress from trip-service to AWS (SQS, RDS) — no namespace restriction needed
# for external traffic; this is left as default-allow. Add explicit rules here
# if you later enforce egress restrictions cluster-wide.
---
# Allow DNS egress (required for SQS, RDS lookups)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trip-service-egress-dns
  namespace: trip-service
spec:
  podSelector:
    matchLabels:
      app: trip-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow egress to AWS SQS (HTTPS) and RDS (PostgreSQL)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trip-service-egress-aws
  namespace: trip-service
spec:
  podSelector:
    matchLabels:
      app: trip-service
  policyTypes:
    - Egress
  egress:
    # HTTPS for SQS API calls
    - ports:
        - protocol: TCP
          port: 443
    # PostgreSQL for RDS
    - ports:
        - protocol: TCP
          port: 5432
