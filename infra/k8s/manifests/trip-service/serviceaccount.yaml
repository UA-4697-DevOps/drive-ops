apiVersion: v1
kind: ServiceAccount
metadata:
  name: trip-service
  namespace: trip-service
  annotations:
    # IRSA - IAM Role for Service Account
    # This annotation links the ServiceAccount to an IAM role for ECR and RDS access
    # Replace with actual IAM role ARN after Terraform provisioning
    eks.amazonaws.com/role-arn: arn:aws:iam::969283154407:role/trip-service-role
  labels:
    app: trip-service
    app.kubernetes.io/name: trip-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kubectl
