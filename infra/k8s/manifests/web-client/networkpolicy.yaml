---
# Allow ingress to web-client from any source (user-facing service).
# In production, restrict to the Ingress controller namespace if desired.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-client-allow-ingress
  namespace: web-client
spec:
  podSelector:
    matchLabels:
      app: web-client
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8083
---
# Allow egress from web-client to driver-service namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-client-egress-driver-service
  namespace: web-client
spec:
  podSelector:
    matchLabels:
      app: web-client
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: driver-service
      ports:
        - protocol: TCP
          port: 8082
---
# Allow egress to kube-dns (required for service discovery)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-client-egress-dns
  namespace: web-client
spec:
  podSelector:
    matchLabels:
      app: web-client
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
