apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-client-ingress
  namespace: web-client
  annotations:
    # Infrastructure values below are populated by infra/scripts/populate-ingress-values.sh
    # after Terraform is applied. Run it once, then commit the updated manifest.
    #
    # How to retrieve values manually:
    #   ACM cert   : cd infra/terragrunt/envs/dev/acm && terragrunt output certificate_arn
    #   Subnets    : cd infra/terragrunt/envs/dev/shared-infra && terragrunt output public_subnet_ids
    #   ALB SG     : cd infra/terragrunt/envs/dev/shared-infra && terragrunt output sg_alb_id

    # ALB Configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # SSL/TLS Configuration — HTTP:80 is kept to enable the ssl-redirect action;
    # the ALB automatically returns 301 → HTTPS for any HTTP request.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_WITH_ACM_CERT_ARN # From acm output: certificate_arn

    # Health Check (web-client nginx health endpoint)
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'

    # Network Configuration
    alb.ingress.kubernetes.io/subnets: REPLACE_WITH_PUBLIC_SUBNET_IDS # From shared-infra output: public_subnet_ids (comma-separated)
    alb.ingress.kubernetes.io/security-groups: REPLACE_WITH_ALB_SG_ID # From shared-infra output: sg_alb_id

    # Tags
    alb.ingress.kubernetes.io/tags: Environment=dev,ManagedBy=ArgoCD,Project=drive-ops,Service=web-client

    # Share the same ALB as client-gateway to save cost (grouped by ALB controller)
    alb.ingress.kubernetes.io/group.name: driveops-dev

    # External DNS annotation — subdomain for the user-facing web app
    external-dns.alpha.kubernetes.io/hostname: web.driveops.dukhota.dev

spec:
  ingressClassName: alb
  rules:
  - host: web.driveops.dukhota.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-client
            port:
              number: 80
