# --- Trip Service Database Secret ---
# Stores the database connection string as a K8s Secret.
# In production, use a sealed-secret or external-secrets-operator
# instead of committing credentials to Git.
apiVersion: v1
kind: Secret
metadata:
  name: trip-service-db
  namespace: default
  labels:
    app: trip-service
type: Opaque
stringData:
  db-url: "postgres://user:password@db-host:5432/trips?sslmode=disable"
