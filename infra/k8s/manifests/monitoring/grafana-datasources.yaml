# --- Grafana Datasource Addon ---
# kube-prometheus-stack provisions Prometheus datasource by default.
# This addon keeps Jaeger datasource provisioning via Grafana sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger.monitoring.svc.cluster.local:16686
        editable: false
