# --- Trip Service Deployment ---
# Minimal K8s Deployment for the Trip Service so that:
#   1. Prometheus can scrape /metrics via the ClusterIP Service
#   2. Jaeger receives traces via OTEL_EXPORTER_OTLP_ENDPOINT
#
# This manifest lives in infra/k8s/monitoring/ because it is part of the
# observability stack. The production deployment (with full DB credentials,
# SQS config, scaling, etc.) would be managed separately.
#
# NOTE: The image tag and environment variables below are placeholders.
#       Replace them with your actual ECR image and configuration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  namespace: trip-service
  labels:
    app: trip-service
    team: platform
    env: dev
    service: trip-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip-service
  template:
    metadata:
      labels:
        app: trip-service
        team: platform
        env: dev
        service: trip-service
    spec:
      # Pod-level security: run as non-root with seccomp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trip-service
          image: 969283154407.dkr.ecr.us-east-2.amazonaws.com/trip-service:latest
          # Container-level security: least-privilege hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          env:
            # --- Database ---
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: trip-service-db
                  key: db-url

            # --- SQS Queues (loaded by broker.LoadConfig()) ---
            - name: AWS_REGION
              value: "us-east-2"
            - name: SQS_TRIP_CREATED_URL
              value: "https://sqs.us-east-2.amazonaws.com/969283154407/trip-created-dev.fifo"
            - name: SQS_DRIVER_ASSIGNED_URL
              value: "https://sqs.us-east-2.amazonaws.com/969283154407/driver-assigned-dev.fifo"
            - name: SQS_TRIP_COMPLETED_URL
              value: "https://sqs.us-east-2.amazonaws.com/969283154407/trip-completed-dev.fifo"

            # --- OpenTelemetry ---
            # Tells the OTel SDK where to send trace spans (Jaeger OTLP gRPC)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "jaeger.monitoring.svc.cluster.local:4317"

            # --- Application ---
            - name: TRIP_SERVICE_PORT
              value: ":8081"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
# --- Trip Service ClusterIP Service ---
# Exposes the Trip Service inside the cluster at:
#   trip-service.default.svc.cluster.local:8081
#
# This is the DNS name that Prometheus uses in its scrape config
# (see prometheus-config.yaml, job_name: "trip-service").
apiVersion: v1
kind: Service
metadata:
  name: trip-service
  namespace: trip-service
  labels:
    app: trip-service
spec:
  type: ClusterIP
  selector:
    app: trip-service
  ports:
    - port: 8081
      targetPort: http
      protocol: TCP
      name: http
