# --- Client Gateway Secret (placeholder) ---
# Stores the Telegram bot token for the client-gateway service.
#
# IMPORTANT: This is a placeholder file for local development.
# In production, this Secret is managed by External Secrets Operator,
# which pulls the value from AWS SSM Parameter Store or Secrets Manager.
# Never commit real credentials to source control.
apiVersion: v1
kind: Secret
metadata:
  name: client-gateway-secret
  namespace: default
  labels:
    app: client-gateway
    team: platform
    env: dev
type: Opaque
stringData:
  # Replace with your actual Telegram bot token (obtain from @BotFather)
  bot-token: "REPLACE_WITH_BOT_TOKEN"
