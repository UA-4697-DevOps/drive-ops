apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
spec:
  validationFailureAction: Enforce
  rules:
    - name: deny-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
      validate:
        message: >-
          Privileged containers are not allowed.
        pattern:
          spec:
            =(template):
              spec:
                containers:
                  - =(securityContext):
                      =(privileged): "false"
