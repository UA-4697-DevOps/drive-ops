# --- Driver Service Database Secret ---
# Stores the database connection string as a K8s Secret.
# In production, use a sealed-secret or external-secrets-operator
# instead of committing credentials to Git.
apiVersion: v1
kind: Secret
metadata:
  name: driver-service-db
  namespace: default
  labels:
    app: driver-service
type: Opaque
stringData:
  db-url: "postgresql+asyncpg://user:password@db-host:5432/driver_db"
