# --- Grafana Dashboard Provider ---
# Tells Grafana WHERE to look for dashboard JSON files on disk.
# Combined with the dashboard ConfigMap mounted at /var/lib/grafana/dashboards,
# this auto-loads dashboards without manual import.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: "default"
        orgId: 1
        folder: ""                              # Root folder in Grafana
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30               # Re-scan for new/updated dashboards every 30s
        options:
          path: /var/lib/grafana/dashboards     # Where dashboard JSON files are mounted
