apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    # Global defaults applied to all scrape jobs
    global:
      scrape_interval: 15s        # How often Prometheus pulls metrics from targets
      evaluation_interval: 15s    # How often Prometheus evaluates alerting rules

    # Scrape configurations — each job defines a group of targets
    scrape_configs:
      # Job 1: Prometheus scrapes itself (for meta-monitoring)
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      # Job 2: Trip Service — the main application we are monitoring
      # Prometheus will HTTP GET http://trip-service.default.svc.cluster.local:8081/metrics
      # every 15 seconds and parse the Prometheus exposition format response
      - job_name: "trip-service"
        static_configs:
          - targets: ["trip-service.default.svc.cluster.local:8081"]
        metrics_path: "/metrics"    # Default path, shown explicitly for clarity

      # Job 3: Web Client — nginx metrics via nginx-prometheus-exporter sidecar
      # The exporter translates nginx stub_status into Prometheus format on port 9113.
      # See infra/k8s/monitoring/web-client.yaml for the deployment.
      - job_name: "web-client"
        static_configs:
          - targets: ["web-client.default.svc.cluster.local:9113"]
        metrics_path: "/metrics"

      # Job 4: Driver Service — Python/FastAPI application metrics
      # Metrics exposed by prometheus-fastapi-instrumentator at /metrics on port 8082.
      # See infra/k8s/monitoring/driver-service.yaml for the deployment.
      - job_name: "driver-service"
        static_configs:
          - targets: ["driver-service.default.svc.cluster.local:8082"]
        metrics_path: "/metrics"

      # Job 5: Client Gateway — Python Telegram bot + FastAPI health server metrics
      # Metrics exposed by prometheus-fastapi-instrumentator at /metrics on port 8080.
      # See infra/k8s/monitoring/client-gateway.yaml for the deployment.
      - job_name: "client-gateway"
        static_configs:
          - targets: ["client-gateway.default.svc.cluster.local:8080"]
        metrics_path: "/metrics"
