# --- Grafana Admin Credentials Secret ---
# Stores Grafana admin username and password as a K8s Secret.
# In production, use a sealed-secret or external-secrets-operator
# instead of committing credentials to Git.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app: grafana
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: admin
