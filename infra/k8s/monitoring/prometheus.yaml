# --- Prometheus Deployment ---
# Runs the Prometheus server that scrapes /metrics endpoints and stores time-series data.
# Configuration is mounted from the prometheus-config ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # Pod-level security: prom/prometheus runs as nobody (UID 65534)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.3.0
          # Container-level security: least-privilege hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            # --config.file: tells Prometheus where to find its scrape config
            - "--config.file=/etc/prometheus/prometheus.yml"
            # --storage.tsdb.retention.time: how long to keep metrics data (15 days is the default)
            - "--storage.tsdb.retention.time=15d"
            # --storage.tsdb.path: where TSDB data is stored (matches our emptyDir mount)
            - "--storage.tsdb.path=/prometheus"
            # --web.enable-lifecycle: allows reloading config via HTTP POST to /-/reload
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          # Mount the ConfigMap as a file inside the container
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            # Writable TSDB data dir — Prometheus stores scraped metrics here
            - name: prometheus-data
              mountPath: /prometheus
            # Writable tmp dir — needed for readOnlyRootFilesystem
            - name: prometheus-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Liveness probe: restart if Prometheus becomes unresponsive
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          # Readiness probe: only route traffic when Prometheus is ready to serve
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # emptyDir for TSDB data (ephemeral — for production, replace with a PVC)
        - name: prometheus-data
          emptyDir: {}
        - name: prometheus-tmp
          emptyDir: {}
---
# --- Prometheus Service ---
# Exposes Prometheus inside the cluster so Grafana can query it at
# http://prometheus.monitoring.svc.cluster.local:9090
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: http
      protocol: TCP
      name: http
