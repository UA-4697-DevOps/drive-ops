apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: trip-service-secrets
  namespace: trip-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: trip-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: drive-ops/dev/rds/credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: drive-ops/dev/rds/credentials
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: drive-ops/dev/trip-service
        property: RDS_ENDPOINT
    - secretKey: TRIP_DB_NAME
      remoteRef:
        key: drive-ops/dev/trip-service
        property: DB_USER
    - secretKey: DB_URL
      remoteRef:
        key: drive-ops/dev/trip-service
        property: RDS_ENDPOINT
