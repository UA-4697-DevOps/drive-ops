apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "0.10.7"
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: REPLACE_WITH_ESO_ROLE_ARN # From external-secrets output: eso_role_arn
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    # ⚠️ AUTOMATED SYNC DISABLED: Placeholder must be replaced first!
    # Get value from: terragrunt output --terragrunt-working-dir=infra/terragrunt/envs/dev/external-secrets eso_role_arn
    # After replacing REPLACE_WITH_ESO_ROLE_ARN above, uncomment the automated section below
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
