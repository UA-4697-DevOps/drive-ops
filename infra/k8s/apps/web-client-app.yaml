apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-client
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/UA-4697-DevOps/drive-ops.git
    targetRevision: HEAD
    path: web-client/charts/web-client
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: web-client
  syncPolicy:
    # ⚠️ AUTOMATED SYNC DISABLED: Placeholders in ingress.yaml must be replaced first!
    # Get values from:
    #   - certificate_arn: terragrunt output --terragrunt-working-dir=infra/terragrunt/envs/dev/acm certificate_arn
    #   - public_subnet_ids: terragrunt output --terragrunt-working-dir=infra/terragrunt/envs/dev/shared-infra public_subnet_ids
    #   - sg_alb_id: terragrunt output --terragrunt-working-dir=infra/terragrunt/envs/dev/shared-infra sg_alb_id
    # After replacing placeholders, uncomment the automated section below
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
