apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: client-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/UA-4697-DevOps/drive-ops.git
    targetRevision: HEAD
    path: infra/k8s/apps/client-gateway
    # ⚠️ NOTE: The ingress manifest in this directory contains placeholders
    # that must be replaced after Terraform deployment:
    #   - REPLACE_WITH_ACM_CERT_ARN
    #   - REPLACE_WITH_PUBLIC_SUBNET_IDS
    #   - REPLACE_WITH_ALB_SG_ID
  destination:
    server: https://kubernetes.default.svc
    namespace: client-gateway
  syncPolicy:
    # ⚠️ AUTOMATED SYNC DISABLED: Placeholders in ingress.yaml must be replaced first!
    # Uncomment 'automated' section after replacing placeholders in infra/k8s/apps/client-gateway/ingress.yaml
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
