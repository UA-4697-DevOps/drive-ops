apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trip-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/UA-4697-DevOps/drive-ops.git
    targetRevision: HEAD
    path: infra/k8s/apps/trip-service
  destination:
    server: https://kubernetes.default.svc
    namespace: trip-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
