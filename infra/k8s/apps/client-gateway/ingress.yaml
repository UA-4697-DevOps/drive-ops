apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: client-gateway-ingress
  namespace: client-gateway
  annotations:
    # PLACEHOLDER: Update certificate ARN, subnets, and security groups after Terraform deployment
    # Get values from: terragrunt output --terragrunt-working-dir=infra/terragrunt/envs/dev/{acm,shared-infra}

    # ALB Configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: driveops-dev-alb

    # SSL/TLS Configuration
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_WITH_ACM_CERT_ARN # From acm output: certificate_arn

    # Health Check — hits the bot's /health HTTP endpoint
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'

    # Network Configuration
    alb.ingress.kubernetes.io/subnets: REPLACE_WITH_PUBLIC_SUBNET_IDS # From shared-infra output: public_subnet_ids (comma-separated)
    alb.ingress.kubernetes.io/security-groups: REPLACE_WITH_ALB_SG_ID # From shared-infra output: sg_alb_id

    # Tags
    alb.ingress.kubernetes.io/tags: Environment=dev,ManagedBy=ArgoCD,Project=drive-ops

    # Share the same ALB as other services via group name
    alb.ingress.kubernetes.io/group.name: driveops-dev

    # External DNS — creates the A record automatically
    external-dns.alpha.kubernetes.io/hostname: api.driveops.dmytrominochkin.cloud

spec:
  ingressClassName: alb
  rules:
  - host: api.driveops.dmytrominochkin.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: client-gateway
            port:
              number: 80
