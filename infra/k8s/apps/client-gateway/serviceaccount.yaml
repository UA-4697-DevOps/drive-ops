apiVersion: v1
kind: ServiceAccount
metadata:
  name: client-gateway-sa
  namespace: client-gateway
  labels:
    app: client-gateway
  annotations:
    # Retrieve after Terraform apply:
    #   terragrunt output --terragrunt-working-dir=infra/terragrunt/envs/dev/shared-infra \
    #     | grep client_gateway   # key: irsa_role_arn
    # Naming convention: arn:aws:iam::<ACCOUNT_ID>:role/Training-drive-ops-dev-client-gateway-role
    # To populate: run the terragrunt output command above, copy the 'irsa_role_arn' value,
    # paste it below, and commit the updated manifest before syncing with ArgoCD.
    eks.amazonaws.com/role-arn: ""  # TODO: populate with: cd infra/terragrunt/envs/dev/shared-infra && terragrunt output irsa_role_arn
