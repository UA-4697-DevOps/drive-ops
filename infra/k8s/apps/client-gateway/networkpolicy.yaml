---
# Default deny all ingress to the client-gateway namespace.
# Explicit allow rules below open only the ports that are required:
#   • client-gateway-allow-alb-ingress — internet traffic forwarded by the ALB (port 8080)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-default-deny-ingress
  namespace: client-gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow ingress from the ALB to client-gateway pods.
# The AWS ALB (target-type=ip) forwards requests directly to pod IPs.
# This rule relies on AWS Security Groups managed by the ALB Ingress Controller
# to restrict traffic to the ALB only; the NetworkPolicy here targets client-gateway pods
# by label selector to ensure the ALB can reach them on port 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-allow-alb-ingress
  namespace: client-gateway
spec:
  podSelector:
    matchLabels:
      app: client-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# Allow egress from client-gateway pods to trip-service namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-egress-trip-service
  namespace: client-gateway
spec:
  podSelector:
    matchLabels:
      app: client-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trip-service
      ports:
        - protocol: TCP
          port: 80
---
# Allow egress from client-gateway pods to driver-service namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-egress-driver-service
  namespace: client-gateway
spec:
  podSelector:
    matchLabels:
      app: client-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: driver-service
      ports:
        - protocol: TCP
          port: 80
---
# Allow egress to kube-dns (required for service discovery)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-egress-dns
  namespace: client-gateway
spec:
  podSelector:
    matchLabels:
      app: client-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow egress to external HTTPS endpoints (Telegram API long-polling)
# The client-gateway bot must reach api.telegram.org:443 for long-polling
# and webhook callbacks. Telegram IPs change frequently so we allow 0.0.0.0/0.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-egress-https
  namespace: client-gateway
spec:
  podSelector:
    matchLabels:
      app: client-gateway
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
