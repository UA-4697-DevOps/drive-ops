---
# Default deny all ingress to the client-gateway namespace.
# Explicit allow rules below open only the ports that are required:
#   • client-gateway-allow-alb-ingress — internet traffic forwarded by the ALB (port 8080)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-default-deny-ingress
  namespace: client-gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow ingress from the ALB to client-gateway pods.
# The AWS ALB (target-type=ip) forwards requests directly to pod IPs from within
# the VPC CIDR (10.0.0.0/16). This rule permits that traffic on the pod's listen
# port (8080) so that HTTP/HTTPS requests routed by the ALB can reach the bot.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-allow-alb-ingress
  namespace: client-gateway
spec:
  podSelector:
    matchLabels:
      app: client-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 8080
---
# Allow egress from client-gateway pods to trip-service namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-egress-trip-service
  namespace: client-gateway
spec:
  podSelector:
    matchLabels:
      app: client-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trip-service
      ports:
        - protocol: TCP
          port: 8081
---
# Allow egress from client-gateway pods to driver-service namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-egress-driver-service
  namespace: client-gateway
spec:
  podSelector:
    matchLabels:
      app: client-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: driver-service
      ports:
        - protocol: TCP
          port: 8082
---
# Allow egress to kube-dns (required for service discovery)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-egress-dns
  namespace: client-gateway
spec:
  podSelector:
    matchLabels:
      app: client-gateway
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
