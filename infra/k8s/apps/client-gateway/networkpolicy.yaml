---
# Deny all ingress (client-gateway is only called internally, not by web-client)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-default-deny-ingress
  namespace: client-gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow egress from client-gateway pods to trip-service namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-egress-trip-service
  namespace: client-gateway
spec:
  podSelector:
    matchLabels:
      app: client-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trip-service
      ports:
        - protocol: TCP
          port: 8081
---
# Allow egress from client-gateway pods to driver-service namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-egress-driver-service
  namespace: client-gateway
spec:
  podSelector:
    matchLabels:
      app: client-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: driver-service
      ports:
        - protocol: TCP
          port: 8082
---
# Allow egress to kube-dns (required for service discovery)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-gateway-egress-dns
  namespace: client-gateway
spec:
  podSelector:
    matchLabels:
      app: client-gateway
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
