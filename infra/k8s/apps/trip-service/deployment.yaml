apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  namespace: dev
  labels:
    app: trip-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip-service
  template:
    metadata:
      labels:
        app: trip-service
    spec:
      serviceAccountName: trip-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: trip-service
        image: 969283154407.dkr.ecr.us-east-2.amazonaws.com/trip-service:f0b02799234b1845412a0d7ce58997829bd693b1 # someone deleted ecr so I can't put image tag there
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: trip-service-secrets
              key: database-url
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: trip-service-config
              key: aws-region
        - name: SQS_TRIP_CREATED_URL
          valueFrom:
            configMapKeyRef:
              name: trip-service-config
              key: sqs-trip-created-url
        - name: SQS_DRIVER_ASSIGNED_URL
          valueFrom:
            configMapKeyRef:
              name: trip-service-config
              key: sqs-driver-assigned-url
        - name: SQS_TRIP_COMPLETED_URL
          valueFrom:
            configMapKeyRef:
              name: trip-service-config
              key: sqs-trip-completed-url
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}

