---
# Allow ingress to trip-service only from client-gateway namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trip-service-ingress-from-client-gateway
  namespace: trip-service
spec:
  podSelector:
    matchLabels:
      app: trip-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: client-gateway
          podSelector:
            matchLabels:
              app: client-gateway
      ports:
        - protocol: TCP
          port: 8081
---
# Allow egress from trip-service to AWS (SQS, RDS) and DNS.
# SQS uses HTTPS (port 443); AWS endpoint IPs are dynamic so we allow 0.0.0.0/0.
# RDS is in the private subnets (10.0.10.0/24, 10.0.11.0/24) on port 5432.
---
# Allow egress to SQS (HTTPS) — trip-created publisher, driver-assigned & trip-completed consumer
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trip-service-egress-https
  namespace: trip-service
spec:
  podSelector:
    matchLabels:
      app: trip-service
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# Allow egress to RDS PostgreSQL in private subnets
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trip-service-egress-rds
  namespace: trip-service
spec:
  podSelector:
    matchLabels:
      app: trip-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.10.0/24
        - ipBlock:
            cidr: 10.0.11.0/24
      ports:
        - protocol: TCP
          port: 5432
---
# Allow DNS egress (required for SQS, RDS lookups)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trip-service-egress-dns
  namespace: trip-service
spec:
  podSelector:
    matchLabels:
      app: trip-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
