apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: "1.15.0"
    helm:
      valuesObject:
        # PLACEHOLDER: Update role ARN after Terraform deployment
        # Get value from: terragrunt output --terragrunt-working-dir=infra/terragrunt/envs/dev/external-dns external_dns_role_arn
        provider: aws

        serviceAccount:
          create: true
          name: external-dns
          annotations:
            eks.amazonaws.com/role-arn: REPLACE_WITH_EXTERNAL_DNS_ROLE_ARN # From external-dns output: external_dns_role_arn

        policy: sync

        sources:
          - ingress

        domainFilters:
          - driveops.dmytrominochkin.cloud

        registry: txt
        txtOwnerId: driveops-dev-eks

        # Resource limits for test cluster
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
