apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ui-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/UA-4697-DevOps/drive-ops
    targetRevision: main
    path: client-gateway/charts/client-gateway
    helm:
      parameters:
        - name: "ingress.enabled"
          value: "true"
        - name: "ingress.host"
          value: "client-gateway.local"
        - name: "ingress.path"
          value: "/"
  destination:
    server: https://kubernetes.default.svc
    namespace: ui-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  revisionHistoryLimit: 10
