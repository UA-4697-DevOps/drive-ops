apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ui-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/UA-4697-DevOps/drive-ops
    targetRevision: main
    path: client-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: ui-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
