---
# Allow ingress to driver-service from client-gateway and web-client
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: driver-service-ingress
  namespace: driver-service
spec:
  podSelector:
    matchLabels:
      app: driver-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: client-gateway
          podSelector:
            matchLabels:
              app: client-gateway
      ports:
        - protocol: TCP
          port: 8082
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: web-client
      ports:
        - protocol: TCP
          port: 8082
---
# Allow egress to kube-dns (required for service discovery)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: driver-service-egress-dns
  namespace: driver-service
spec:
  podSelector:
    matchLabels:
      app: driver-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
