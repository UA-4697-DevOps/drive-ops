name: Trip Service CI

on:
  push:
    branches: [main, trip-service]
    paths:
      - 'trip-service/**'
      - '.github/workflows/trip-service-ci.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trip-service/**'
      - '.github/workflows/trip-service-ci.yml'
      - 'docker-compose.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'
  SQS_TRIP_CREATED_URL: https://sqs.us-east-2.amazonaws.com/123456789012/trip-created-dev.fifo
  SQS_DRIVER_ASSIGNED_URL: https://sqs.us-east-2.amazonaws.com/123456789012/driver-assigned-dev.fifo
  SQS_TRIP_COMPLETED_URL: https://sqs.us-east-2.amazonaws.com/123456789012/trip-completed-dev.fifo
  AWS_REGION: us-east-2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trip-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: trip-service/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
          working-directory: trip-service

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
        run:
          working-directory: trip-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: trip-service/go.sum

      - name: Run unit tests
        run: |
          go test -v ./internal/repository/...

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    env:
      # These match your Go code's getEnv fallbacks and your Acergo15 setup
      TRIP_DB_NAME: trip_service_test
      DRIVER_DB_NAME: dummy_db
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
      AWS_REGION: us-east-2

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Start Infrastructure
        # We use the specific test compose file to ensure we use the 'mock' environment
        run: |
          docker compose -f trip-service/tests/integration/docker-compose.test.yml up -d --build

      - name: Wait for Trip Service
        run: |
          echo "Waiting for http://localhost:8081/health..."
          # 30 retries * 2s = 60s total wait
          timeout 60s bash -c 'until curl -f -s http://localhost:8081/health; do echo "Waiting..."; sleep 2; done' || {
            echo "ERROR: Service did not start in time. Printing logs:"
            docker logs trip-service-container
            exit 1
          }

      - name: Run Go integration tests
        working-directory: trip-service
        run: |
          # The runner is outside the Docker network, so it hits localhost:5433 (mapped in compose)
          export DB_HOST=localhost
          export DB_PORT=5433
          export DB_USER=testuser
          export DB_PASSWORD=testpass
          export TRIP_DB_NAME=trip_service_test
          
          # Run the actual test binary
          AWS_ACCESS_KEY_ID=mock go test -v -race ./tests/integration/...

      - name: Show logs on failure
        if: failure()
        run: |
          docker ps
          docker logs trip-service-container
          docker logs trip-service-test-db

      - name: Cleanup
        if: always()
        run: docker compose -f trip-service/tests/integration/docker-compose.test.yml down -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    # Build only starts if both test suites pass successfully
    needs: [unit-test, integration-test]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        # Skips login for PRs from forks for security unless you explicitly allow it
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Targets your specific ghcr.io repository for the trip-service
          images: ghcr.io/${{ github.repository_owner }}/trip-service
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          # Context set to the service directory as per project structure
          context: ./trip-service
          # Enable push only for non-PR events to the main or trip-service branches
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optimized GHA caching to speed up subsequent CI runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
