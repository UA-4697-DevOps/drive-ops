name: Trip Service CI

on:
  push:
    branches: [main, trip-service]
    paths:
      - 'trip-service/**'
      - '.github/workflows/trip-service-ci.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trip-service/**'
      - '.github/workflows/trip-service-ci.yml'
      - 'docker-compose.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trip-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: trip-service/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
          working-directory: trip-service

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
        run:
          working-directory: trip-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: trip-service/go.sum

      - name: Run unit tests
        run: |
          go test -v ./internal/repository/...

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: trip-service/go.sum

      - name: Create .env file for docker-compose
        run: |
          cat > .env << EOF
          # Database
          DB_HOST=db
          DB_PORT=5432
          DB_USER=vagrant
          DB_PASSWORD=trips
          TRIP_DB_NAME=trip_db

          # RabbitMQ
          RABBITMQ_HOST=mq
          RABBITMQ_PORT=5672
          RABBITMQ_USER=testuser
          RABBITMQ_PASSWORD=testpass

          # Server
          TRIP_SERVICE_PORT=:8081
          EOF

      - name: Start trip-service stack
        run: docker compose up -d trip-service --build

      - name: Wait for services
        run: |
          echo "Waiting for services to be healthy..."

          timeout 90 bash -c 'until docker compose ps | grep -E "trip-service.*healthy"; do
            echo "$(date): Waiting for trip-service..."
            docker compose ps
            sleep 3
          done' || {
            echo "Service failed to become healthy"
            docker compose logs
            exit 1
          }

          echo "Services are healthy!"

      - name: Verify health endpoint
        run: |
          echo "Testing /health endpoint..."

          response=$(curl -f -s http://localhost:8081/health)
          echo "Response: $response"

          if ! echo "$response" | jq -e '.status' > /dev/null 2>&1; then
            echo "Invalid health response"
            exit 1
          fi

          echo "Health check passed!"

      - name: Prepare test database
        run: |
          docker compose stop trip-service

          docker compose exec -T db psql -U vagrant -d postgres -c "
            SELECT pg_terminate_backend(pid)
            FROM pg_stat_activity
            WHERE datname = 'trip_db' AND pid <> pg_backend_pid();
          "
          docker compose exec -T db psql -U vagrant -d postgres -c "DROP DATABASE IF EXISTS trip_db;"
          docker compose exec -T db psql -U vagrant -d postgres -c "CREATE DATABASE trip_db;"

          echo "Database recreated for integration tests"

      - name: Run migrations and restart service
        run: |
          docker compose up -d trip-migrations
          docker compose logs trip-migrations

          docker compose up -d trip-service

          echo "Waiting for trip-service to be healthy..."
          timeout 60 bash -c 'until docker compose ps | grep -E "trip-service.*healthy"; do
            echo "$(date): Waiting for trip-service..."
            docker compose ps trip-service
            sleep 3
          done' || {
            echo "Service failed to become healthy after database recreation"
            docker compose logs trip-service
            exit 1
          }

          echo "Trip-service is healthy and ready for tests!"

      - name: Run Go integration tests
        working-directory: trip-service
        run: go test -v -race ./tests/integration/...
        env:
          SERVICE_URL: http://localhost:8081
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: vagrant
          DB_PASSWORD: trips
          TRIP_DB_NAME: trip_db

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Status ==="
          docker compose ps

          echo ""
          echo "=== Trip Service Logs ==="
          docker compose logs trip-service

          echo ""
          echo "=== PostgreSQL Logs ==="
          docker compose logs db

      - name: Cleanup
        if: always()
        run: docker compose down -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/trip-service
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./trip-service
          # push: ${{ github.event_name != 'pull_request' }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
