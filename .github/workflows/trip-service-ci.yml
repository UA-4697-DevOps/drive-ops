name: Trip Service CI

on:
  push:
    branches: [main, trip-service]
    paths:
      - 'trip-service/**'
      - '.github/workflows/trip-service-ci.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trip-service/**'
      - '.github/workflows/trip-service-ci.yml'
      - 'docker-compose.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'
  AWS_REGION: us-east-2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trip-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: trip-service/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
          working-directory: trip-service

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
        run:
          working-directory: trip-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: trip-service/go.sum

      - name: Run unit tests
        run: |
          go test -v ./internal/repository/...

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    env:
      TRIP_DB_NAME: trip_service_test
      DRIVER_DB_NAME: dummy_db
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
      AWS_REGION: us-east-2
      SQS_TRIP_CREATED_URL: http://mock-url
      SQS_DRIVER_ASSIGNED_URL: http://mock-url
      SQS_TRIP_COMPLETED_URL: http://mock-url

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Start Infrastructure
        # We use the specific test compose file to ensure we use the 'mock' environment
        run: |
          docker compose -f trip-service/tests/integration/docker-compose.test.yml up -d --build

      - name: Wait for Trip Service
        run: |
          echo "Waiting for http://localhost:8081/health..."
          # 30 retries * 2s = 60s total wait
          timeout 60s bash -c 'until curl -f -s http://localhost:8081/health; do echo "Waiting..."; sleep 2; done' || {
            echo "ERROR: Service did not start in time. Printing logs:"
            docker logs trip-service-container
            exit 1
          }

      - name: Run Go integration tests
        working-directory: trip-service
        run: |
          # 1. Database Connection (Runner -> Docker Container)
          export DB_HOST=localhost
          export DB_PORT=5433
          export DB_USER=testuser
          export DB_PASSWORD=testpass
          export TRIP_DB_NAME=trip_service_test
          
          # 2. SQS Mocking (Ensures Go SDK doesn't look for real AWS URLs)
          # We use the values defined in the job's 'env' section
          export SQS_TRIP_CREATED_URL=${{ env.SQS_TRIP_CREATED_URL }}
          export SQS_DRIVER_ASSIGNED_URL=${{ env.SQS_DRIVER_ASSIGNED_URL }}
          export SQS_TRIP_COMPLETED_URL=${{ env.SQS_TRIP_COMPLETED_URL }}
          
          # 3. AWS Credentials for Mocking
          export AWS_ACCESS_KEY_ID=mock
          export AWS_SECRET_ACCESS_KEY=mock
          export AWS_REGION=us-east-2
          
          # 4. Execute tests with race detection
          go test -v -race ./tests/integration/...

      - name: Show logs on failure
        if: failure()
        run: |
          docker ps
          docker logs trip-service-container
          docker logs trip-service-test-db

      - name: Cleanup
        if: always()
        run: docker compose -f trip-service/tests/integration/docker-compose.test.yml down -v

  publish-to-ecr:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    # UPDATED: Added feat/trip-ci so your current work triggers the push
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || 
       github.ref == 'refs/heads/trip-service' || 
       github.ref == 'refs/heads/feat/trip-ci')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Reverted to stable v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::969283154407:role/trip-service-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: trip-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build context is scoped to the service directory
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./trip-service
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Set the output for the next step
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Generate Build Metadata
        run: |
          echo "IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}" > build-metadata.txt
          echo "COMMIT_SHA: ${{ github.sha }}" >> build-metadata.txt
          echo "BUILD_TIME: $(date -u)" >> build-metadata.txt

      - name: Upload Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trip-service-metadata
          path: build-metadata.txt
