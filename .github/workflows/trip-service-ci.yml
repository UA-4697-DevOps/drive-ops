name: Trip Service CI

on:
  push:
    branches: [main]
    paths:
      - 'trip-service/**'
      - '.github/workflows/trip-service-ci.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trip-service/**'
      - '.github/workflows/trip-service-ci.yml'
      - 'docker-compose.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'
  AWS_REGION: us-east-2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trip-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: trip-service/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
          working-directory: trip-service

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
        run:
          working-directory: trip-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: trip-service/go.sum

      - name: Run unit tests
        run: |
          go test -v ./internal/repository/...

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    env:
      TRIP_DB_NAME: trip_service_test
      DRIVER_DB_NAME: dummy_db
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
      AWS_REGION: us-east-2
      SQS_TRIP_CREATED_URL: http://mock-url
      SQS_DRIVER_ASSIGNED_URL: http://mock-url
      SQS_TRIP_COMPLETED_URL: http://mock-url

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Start Infrastructure
        # We use the specific test compose file to ensure we use the 'mock' environment
        run: |
          docker compose -f trip-service/tests/integration/docker-compose.test.yml up -d --build

      - name: Wait for Trip Service
        run: |
          echo "Waiting for http://localhost:8081/health..."
          # 30 retries * 2s = 60s total wait
          timeout 60s bash -c 'until curl -f -s http://localhost:8081/health; do echo "Waiting..."; sleep 2; done' || {
            echo "ERROR: Service did not start in time. Printing logs:"
            docker logs trip-service-container
            exit 1
          }

      - name: Run Go integration tests
        working-directory: trip-service
        run: |
          # 1. Database Connection (Runner -> Docker Container)
          export DB_HOST=localhost
          export DB_PORT=5433
          export DB_USER=testuser
          export DB_PASSWORD=testpass
          export TRIP_DB_NAME=trip_service_test
          
          # 2. SQS Mocking (Ensures Go SDK doesn't look for real AWS URLs)
          # We use the values defined in the job's 'env' section
          export SQS_TRIP_CREATED_URL=${{ env.SQS_TRIP_CREATED_URL }}
          export SQS_DRIVER_ASSIGNED_URL=${{ env.SQS_DRIVER_ASSIGNED_URL }}
          export SQS_TRIP_COMPLETED_URL=${{ env.SQS_TRIP_COMPLETED_URL }}
          
          # 3. AWS Credentials for Mocking
          export AWS_ACCESS_KEY_ID=mock
          export AWS_SECRET_ACCESS_KEY=mock
          export AWS_REGION=us-east-2
          
          # 4. Execute tests with race detection
          go test -v -race ./tests/integration/...

      - name: Show logs on failure
        if: failure()
        run: |
          docker ps
          docker logs trip-service-container
          docker logs trip-service-test-db

      - name: Cleanup
        if: always()
        run: docker compose -f trip-service/tests/integration/docker-compose.test.yml down -v

  publish-to-ecr:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    # Only run on push to main (matches AWS OIDC Trust Policy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write # Required for AWS OIDC authentication
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # 1. Set up Docker Buildx (The engine required for caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Login to AWS via OIDC (Secure, Keyless!)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/trip-service-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      # 3. Authorize Docker client in ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build, Push, and CACHE (The hybrid optimized step)
      - name: Build and Push Image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: ./trip-service
          push: true
          # Add SHA tag (for uniqueness)
          tags: ${{ steps.login-ecr.outputs.registry }}/trip-service:${{ github.sha }}
          # Free GitHub Actions Caching!
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Build Metadata
        run: |
          # Note: Using the registry output ensures reliability
          echo "IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/trip-service:${{ github.sha }}" > build-metadata.txt
          echo "COMMIT_SHA: ${{ github.sha }}" >> build-metadata.txt
          echo "BUILD_TIME: $(date -u)" >> build-metadata.txt

      - name: Upload Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trip-service-metadata
          path: build-metadata.txt
