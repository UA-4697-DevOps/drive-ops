name: Trip Service CI

on:
  push:
    branches: [main, trip-service]
    paths:
      - 'trip-service/**'
      - '.github/workflows/trip-service-ci.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trip-service/**'
      - '.github/workflows/trip-service-ci.yml'
      - 'docker-compose.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'
  SQS_TRIP_CREATED_URL: https://sqs.us-east-2.amazonaws.com/123456789012/trip-created-dev.fifo
  SQS_DRIVER_ASSIGNED_URL: https://sqs.us-east-2.amazonaws.com/123456789012/driver-assigned-dev.fifo
  SQS_TRIP_COMPLETED_URL: https://sqs.us-east-2.amazonaws.com/123456789012/trip-completed-dev.fifo
  AWS_REGION: us-east-2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trip-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: trip-service/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
          working-directory: trip-service

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
        run:
          working-directory: trip-service

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: trip-service/go.sum

      - name: Run unit tests
        run: |
          go test -v ./internal/repository/...

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: trip-service/go.sum

      - name: Create .env file for docker-compose
        run: |
          cat > .env << EOF
          # Database
          DB_HOST=db
          DB_PORT=5432
          DB_USER=vagrant
          DB_PASSWORD=trips
          TRIP_DB_NAME=trip_db

          # AWS SQS (Mandatory for Fail-Fast Init)
          SQS_TRIP_CREATED_URL=https://sqs.us-east-2.amazonaws.com/123456789012/trip-created-dev.fifo
          SQS_DRIVER_ASSIGNED_URL=https://sqs.us-east-2.amazonaws.com/123456789012/driver-assigned-dev.fifo
          SQS_TRIP_COMPLETED_URL=https://sqs.us-east-2.amazonaws.com/123456789012/trip-completed-dev.fifo
          AWS_REGION=us-east-2
          AWS_ACCESS_KEY_ID=testing
          AWS_SECRET_ACCESS_KEY=testing

          # Server
          TRIP_SERVICE_PORT=:8081
          EOF

      - name: Start trip-service stack
        run: docker compose up -d trip-service --build

      - name: Wait for services
        run: |
          echo "Waiting for services to be healthy..."
          timeout 90 bash -c 'until docker compose ps | grep -E "trip-service.*(healthy|running)"; do
            echo "$(date): Waiting for trip-service..."
            sleep 3
          done' || {
            echo "Service failed to start. Likely SQS initialization error."
            docker compose logs trip-service
            exit 1
          }

      - name: Verify health endpoint
        run: |
          echo "Testing /health endpoint..."
          response=$(curl -f -s http://localhost:8081/health)
          echo "Response: $response"
          # Verify the 'ok' status which confirms SQS and DB connectivity
          if ! echo "$response" | jq -e '.status == "ok"' > /dev/null 2>&1; then
            echo "Invalid health response or service not fully initialized"
            exit 1
          fi

      - name: Run Go integration tests
        working-directory: trip-service
        run: go test -v -race ./tests/integration/...
        env:
          SERVICE_URL: http://localhost:8081
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: vagrant
          DB_PASSWORD: trips
          TRIP_DB_NAME: trip_db
          # Inject SQS vars for the Go test process itself
          SQS_TRIP_CREATED_URL: https://sqs.us-east-2.amazonaws.com/123456789012/trip-created-dev.fifo
          AWS_REGION: us-east-2

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs trip-service

      - name: Cleanup
        if: always()
        run: docker compose down -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    # Build only starts if both test suites pass successfully
    needs: [unit-test, integration-test]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        # Skips login for PRs from forks for security unless you explicitly allow it
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Targets your specific ghcr.io repository for the trip-service
          images: ghcr.io/${{ github.repository_owner }}/trip-service
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          # Context set to the service directory as per project structure
          context: ./trip-service
          # Enable push only for non-PR events to the main or trip-service branches
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optimized GHA caching to speed up subsequent CI runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
