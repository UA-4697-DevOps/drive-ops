name: Trip Service CI

on:
  push:
    branches: [main]
    paths:
      - 'trip-service/**'
      - '.github/workflows/trip-service-ci.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trip-service/**'
      - '.github/workflows/trip-service-ci.yml'
      - 'docker-compose.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'
  AWS_REGION: us-east-2
  ECR_REPOSITORY: trip-service

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trip-service

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go with Swagger
        uses: ./.github/actions/setup-go-with-swagger
        with:
          go-version: ${{ env.GO_VERSION }}
          service-path: trip-service

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
          working-directory: trip-service

  swagger-validate:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: trip-service

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go with Swagger
        uses: ./.github/actions/setup-go-with-swagger
        with:
          go-version: ${{ env.GO_VERSION }}
          service-path: trip-service

      - name: Verify swagger.json exists
        run: |
          if [ ! -f docs/swagger.json ]; then
            echo "ERROR: docs/swagger.json not generated"
            exit 1
          fi
          echo "swagger.json successfully generated"

      - name: Validate JSON syntax
        run: |
          if ! jq empty docs/swagger.json; then
            echo "ERROR: swagger.json is not valid JSON"
            exit 1
          fi
          echo "swagger.json is valid JSON"

      - name: Check for required OpenAPI fields
        run: |
          # Check swagger version
          if ! jq -e '.swagger' docs/swagger.json > /dev/null; then
            echo "ERROR: Missing 'swagger' field"
            exit 1
          fi

          # Check info section
          if ! jq -e '.info.title' docs/swagger.json > /dev/null; then
            echo "ERROR: Missing 'info.title' field"
            exit 1
          fi

          # Check paths section
          if ! jq -e '.paths' docs/swagger.json > /dev/null; then
            echo "ERROR: Missing 'paths' field"
            exit 1
          fi

          # Verify critical endpoints exist
          endpoints=("/health" "/trips" "/trips/{id}" "/trips/{id}/assign-driver")
          for endpoint in "${endpoints[@]}"; do
            if ! jq -e ".paths[\"$endpoint\"]" docs/swagger.json > /dev/null; then
              echo "ERROR: Missing endpoint: $endpoint"
              exit 1
            fi
            echo "✓ Endpoint documented: $endpoint"
          done

          echo "All required OpenAPI fields present"

      - name: Verify spec is complete
        run: |
          echo "Swagger validation completed successfully!"
          echo "Spec contains $(jq '.paths | length' docs/swagger.json) endpoints"
          echo "✓ OpenAPI documentation is valid and up-to-date"

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
        run:
          working-directory: trip-service

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go with Swagger
        uses: ./.github/actions/setup-go-with-swagger
        with:
          go-version: ${{ env.GO_VERSION }}
          service-path: trip-service

      - name: Run unit tests
        run: |
          go test -v ./internal/repository/...

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    env:
      TRIP_DB_NAME: trip_service_test
      DRIVER_DB_NAME: dummy_db
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
      AWS_REGION: us-east-2
      SQS_TRIP_CREATED_URL: http://mock-url
      SQS_DRIVER_ASSIGNED_URL: http://mock-url
      SQS_TRIP_COMPLETED_URL: http://mock-url

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Start Infrastructure
        # We use the specific test compose file to ensure we use the 'mock' environment
        run: |
          docker compose -f trip-service/tests/integration/docker-compose.test.yml up -d --build

      - name: Wait for Trip Service
        run: |
          echo "Waiting for http://localhost:8081/health..."
          # 30 retries * 2s = 60s total wait
          timeout 60s bash -c 'until curl -f -s http://localhost:8081/health; do echo "Waiting..."; sleep 2; done' || {
            echo "ERROR: Service did not start in time. Printing logs:"
            docker logs trip-service-container
            exit 1
          }

      - name: Run Go integration tests
        working-directory: trip-service
        run: |
          # 1. Database Connection (Runner -> Docker Container)
          export DB_HOST=localhost
          export DB_PORT=5433
          export DB_USER=testuser
          export DB_PASSWORD=testpass
          export TRIP_DB_NAME=trip_service_test

          # 2. SQS Mocking (Ensures Go SDK doesn't look for real AWS URLs)
          # We use the values defined in the job's 'env' section
          export SQS_TRIP_CREATED_URL=${{ env.SQS_TRIP_CREATED_URL }}
          export SQS_DRIVER_ASSIGNED_URL=${{ env.SQS_DRIVER_ASSIGNED_URL }}
          export SQS_TRIP_COMPLETED_URL=${{ env.SQS_TRIP_COMPLETED_URL }}

          # 3. AWS Credentials for Mocking
          export AWS_ACCESS_KEY_ID=mock
          export AWS_SECRET_ACCESS_KEY=mock
          export AWS_REGION=us-east-2

          # 4. Execute tests with race detection
          go test -v -race ./tests/integration/...

      - name: Show logs on failure
        if: failure()
        run: |
          docker ps
          docker logs trip-service-container
          docker logs trip-service-test-db

      - name: Cleanup
        if: always()
        run: docker compose -f trip-service/tests/integration/docker-compose.test.yml down -v

  publish-to-ecr:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    # Build only starts if all validations and tests pass successfully
    needs: [swagger-validate, unit-test, integration-test]
    # Only run on push to main (matches AWS OIDC Trust Policy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write # Required for AWS OIDC authentication
      contents: write # Required to commit updated image tag

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Authenticate to AWS ECR
        id: ecr-auth
        uses: ./.github/actions/aws-ecr-auth
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          role-name: trip-service-github-actions-role

      - name: Build and Push Docker Image
        id: build-push
        uses: ./.github/actions/docker-build-push-ecr
        with:
          ecr-repository: ${{ env.ECR_REPOSITORY }}
          ecr-registry: ${{ steps.ecr-auth.outputs.registry }}
          context: ./trip-service
          push: 'true'
          cache-scope: trip-service

      - name: Export Build Metadata
        uses: ./.github/actions/export-build-metadata
        with:
          ecr-registry: ${{ steps.ecr-auth.outputs.registry }}
          ecr-repository: ${{ env.ECR_REPOSITORY }}
          image-tag: ${{ steps.build-push.outputs.version }}
          image-digest: ${{ steps.build-push.outputs.digest }}
          artifact-name: trip-service-metadata

      - name: Update Helm values with new image tag
        run: |
          sed -i 's|tag: ".*"|tag: "${{ steps.build-push.outputs.version }}"|' \
            trip-service/charts/trip-service/values-dev.yaml

      - name: Commit updated image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trip-service/charts/trip-service/values-dev.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(trip-service): update dev image tag to ${{ steps.build-push.outputs.version }}"
          for attempt in 1 2 3; do
            git pull --rebase origin HEAD && git push && exit 0
            echo "Push failed (attempt $attempt/3), retrying in ${attempt}s..."
            sleep "$attempt"
          done
          echo "ERROR: failed to push after 3 attempts"
          exit 1

