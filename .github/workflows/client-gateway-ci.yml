name: Client Gateway CI
on:
  push:
    branches: [ feature/client-gateway-ci, main ]
    paths:
      - 'client-gateway/**'
      - '.github/workflows/client-gateway-ci.yml'
  pull_request:
    branches: [ feature/client-gateway-ci, main ]
    paths:
      - 'client-gateway/**'
      - '.github/workflows/client-gateway-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Infrastructure Stub
        run: echo "Client Gateway CI is ready. Starting Python environment setup..."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Version
        run: |
          python --version
          echo "Python 3.11 is successfully installed for Client Gateway."

      - name: Run Client Gateway Tests
        working-directory: ./client-gateway
        run: |
          echo "Looking for tests in ./client-gateway..."

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client-gateway
          file: ./client-gateway/Dockerfile
          push: false
          tags: client-gateway:latest
