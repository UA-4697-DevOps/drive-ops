name: Client Gateway CI

on:
  push:
    branches: [main]
    paths:
      - 'client-gateway/**'
      - '.github/workflows/client-gateway-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client-gateway/**'
      - '.github/workflows/client-gateway-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ECR_REPOSITORY: client-gateway
  AWS_REGION: us-east-2
  SHOULD_PUSH_IMAGE: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client-gateway

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'client-gateway/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Run Linting (Ruff)
        run: ruff check .

      - name: Run Client Gateway Tests
        run: pytest -q

      - name: Syntax check
        run: python -m compileall -q bot

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    # OIDC role trust policy only allows main branch — skip on PRs
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    outputs:
      image_uri: ${{ steps.build.outputs.image-uri }}
      image_tag: ${{ steps.build.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: AWS ECR Authentication
        id: login-ecr
        uses: ./.github/actions/aws-ecr-auth
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          role-name: Training-GitHub-ECR-Push

      - name: Build and Push to ECR
        id: build
        uses: ./.github/actions/docker-build-push-ecr
        with:
          ecr-repository: ${{ env.ECR_REPOSITORY }}
          ecr-registry: ${{ steps.login-ecr.outputs.registry }}
          context: ./client-gateway
          push: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
          cache-scope: client-gateway

      - name: Export and Upload Build Metadata
        if: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
        uses: ./.github/actions/export-build-metadata
        with:
          ecr-registry: ${{ steps.login-ecr.outputs.registry }}
          ecr-repository: ${{ env.ECR_REPOSITORY }}
          image-tag: ${{ steps.build.outputs.version }}
          image-digest: ${{ steps.build.outputs.digest }}
          artifact-name: client-gateway-metadata