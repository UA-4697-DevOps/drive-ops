name: Client Gateway CI

on:
  push:
    branches: [ feature/client-gateway-ci, main ]
    paths:
      - 'client-gateway/**'
      - '.github/workflows/client-gateway-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'client-gateway/**'
      - '.github/workflows/client-gateway-ci.yml'

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run Client Gateway Tests
        working-directory: ./client-gateway
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest pytest-asyncio
          python -m pytest -q

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client-gateway
          file: ./client-gateway/Dockerfile
          push: false
          tags: client-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
