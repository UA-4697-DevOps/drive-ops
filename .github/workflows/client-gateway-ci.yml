name: Client Gateway CI

on:
  push:
    branches: [main]
    paths:
      - 'client-gateway/**'
      - '.github/workflows/client-gateway-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client-gateway/**'
      - '.github/workflows/client-gateway-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ECR_REPOSITORY: client-gateway
  AWS_REGION: us-east-2
  SHOULD_PUSH_IMAGE: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client-gateway

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'client-gateway/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Run Linting (Ruff)
        run: ruff check .

      - name: Run Client Gateway Tests
        run: pytest -q

      - name: Syntax check
        run: python -m compileall -q bot

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    # OIDC role trust policy only allows main branch — skip on PRs
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    outputs:
      image_uri: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build-and-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/client-gateway-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ./client-gateway
          file: ./client-gateway/Dockerfile
          push: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=client-gateway
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=client-gateway' || '' }}

      - name: Export build metadata
        if: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
        run: |
          mkdir -p build-artifacts

          URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          TAG="${{ steps.meta.outputs.version }}"
          DIGEST="${{ steps.build-and-push.outputs.digest }}"

          echo "image_uri=$URI" > build-artifacts/metadata.env
          echo "image_tag=$TAG" >> build-artifacts/metadata.env
          echo "image_digest=$DIGEST" >> build-artifacts/metadata.env

          jq -n \
            --arg uri "$URI" \
            --arg tag "$TAG" \
            --arg digest "$DIGEST" \
            '{uri: $uri, tag: $tag, digest: $digest}' > build-artifacts/metadata.json

      - name: Upload build metadata
        if: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: client-gateway-metadata
          path: build-artifacts/