name: Client Gateway CI

on:
  push:
    branches:
      - 'feature/client/*'
      - 'main'
    paths:
      - 'client-gateway/**'
      - '.github/workflows/client-gateway-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'client-gateway/**'
      - '.github/workflows/client-gateway-ci.yml'
  workflow_dispatch:
    

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true      
 
env:
  AWS_REGION: us-east-2

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./client-gateway
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest pytest-asyncio ruff

      - name: Run Linting (Ruff)
        working-directory: ./client-gateway
        run: ruff check .

      - name: Run Client Gateway Tests
        working-directory: ./client-gateway
        # allow exit code 5 (no tests collected) while client-gateway is a stub; remove/update when tests are added or discovery is expected
        run: bash -lc "python -m pytest -q || [ $? -eq 5 ]" # allow exit code 5: no tests collected; remove this when tests are present

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Docker Metadata
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${REPO_LOWER}/client-gateway"
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/client-gateway-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and Push to Amazon ECR
        uses: docker/build-push-action@v6
        with:
          context: ./client-gateway
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/client-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Build Metadata
        run: |
          # Note: Using the registry output ensures reliability
          echo "IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/client-gateway:${{ github.sha }}" > build-metadata.txt
          echo "COMMIT_SHA: ${{ github.sha }}" >> build-metadata.txt
          echo "BUILD_TIME: $(date -u)" >> build-metadata.txt

      - name: Upload Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-gateway-metadata
          path: build-metadata.txt