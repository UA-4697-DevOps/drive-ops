name: External Secrets Operator Setup

on:
  push:
    branches: [main]
    paths:
      - 'infra/k8s/external-secrets/**'
      - 'infra/terraform/modules/external-secrets/**'
      - '.github/workflows/external-secrets-setup.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: '1.10.0'
  ESO_VERSION: '0.10.0'
  AWS_REGION: 'us-east-2'

jobs:
  terraform-irsa:
    name: Terraform IRSA for ESO
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Training-trip-service-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infra/terraform/bootstrap

      - name: Terraform Plan
        run: terraform plan -target=module.external_secrets
        working-directory: infra/terraform/bootstrap

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -target=module.external_secrets -auto-approve
        working-directory: infra/terraform/bootstrap

  install-eso:
    name: Helm Install ESO
    runs-on: ubuntu-latest
    needs: terraform-irsa
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Training-trip-service-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name drive-ops-dev-cluster

      - name: Add ESO Helm repo
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update

      - name: Install ESO
        run: |
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --version ${{ env.ESO_VERSION }} \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ secrets.ESO_ROLE_ARN }} \
            --wait

  apply-manifests:
    name: Apply ExternalSecret Manifests
    runs-on: ubuntu-latest
    needs: install-eso
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Training-trip-service-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name drive-ops-dev-cluster

      - name: Apply ClusterSecretStore
        run: kubectl apply -f infra/k8s/external-secrets/cluster-secret-store.yaml

      - name: Apply ExternalSecrets
        run: kubectl apply -f infra/k8s/external-secrets/driver-service-external-secret.yaml -f infra/k8s/external-secrets/trip-service-external-secret.yaml

      - name: Verify ExternalSecrets
        run: |
          kubectl wait --for=condition=Ready externalsecret/driver-service-external-secret -n dev --timeout=60s
          kubectl wait --for=condition=Ready externalsecret/trip-service-external-secret -n dev --timeout=60s
