name: Web Client CI

on:
  push:
    branches: [main]
    paths:
      - 'web-client/**'
      - '.github/workflows/web-client-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web-client/**'
      - '.github/workflows/web-client-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ECR_REPOSITORY: web-client
  AWS_REGION: us-east-2
  SHOULD_PUSH_IMAGE: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web-client

    steps:
      - uses: actions/checkout@v6

      - name: Validate HTML (htmlhint)
        run: |
          npm install -g htmlhint --silent
          htmlhint index.html

      - name: Check nginx template syntax
        run: |
          # Substitute a dummy upstream so nginx -t can parse the template
          export DRIVER_SERVICE_URL=http://localhost:8082
          envsubst '${DRIVER_SERVICE_URL}' < nginx/default.conf.template > /tmp/default.conf
          docker run --rm \
            -v /tmp/default.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:1.27-alpine nginx -t

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: validate
    # OIDC role trust policy only allows main branch — skip on PRs
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    outputs:
      image_uri: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build-and-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Training-GitHub-ECR-Push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ./web-client
          file: ./web-client/Dockerfile
          push: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-client
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=web-client' || '' }}

      - name: Export build metadata
        if: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
        run: |
          mkdir -p build-artifacts

          URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          TAG="${{ steps.meta.outputs.version }}"
          DIGEST="${{ steps.build-and-push.outputs.digest }}"

          echo "image_uri=$URI" > build-artifacts/metadata.env
          echo "image_tag=$TAG" >> build-artifacts/metadata.env
          echo "image_digest=$DIGEST" >> build-artifacts/metadata.env

          jq -n \
            --arg uri "$URI" \
            --arg tag "$TAG" \
            --arg digest "$DIGEST" \
            '{uri: $uri, tag: $tag, digest: $digest}' > build-artifacts/metadata.json

      - name: Upload build metadata
        if: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: web-client-metadata
          path: build-artifacts/
