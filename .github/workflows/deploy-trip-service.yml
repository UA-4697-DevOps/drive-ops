name: Deploy TripService

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to build and push (e.g. v1.0.0, rc-1)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: trip-service

jobs:
  build-and-push:
    name: Build & Push to ECR (${{ inputs.environment }})
    runs-on: ubuntu-22.04
    environment: ${{ inputs.environment }}

    concurrency:
      group: trip-service-build-push-${{ inputs.environment }}
      cancel-in-progress: true

    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Training-trip-service-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: ./trip-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        if: always()
        run: |
          echo "============================================"
          echo " TripService ECR Publish Summary"
          echo "============================================"
          echo " Environment:  ${{ inputs.environment }}"
          echo " Image Tag:    ${{ inputs.image_tag }}"
          echo " Image URI:    ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image_tag }}"
          echo " Status:       ${{ job.status }}"
          echo "============================================"
