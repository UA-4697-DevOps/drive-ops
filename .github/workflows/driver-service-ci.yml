name: Driver Service CI

on:
  push:
    paths:
      - "driver-service/**"
      - ".github/workflows/driver-service-ci.yml"
  pull_request:
    paths:
      - "driver-service/**"
      - ".github/workflows/driver-service-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Infrastructure Stub
        run: echo "Driver Service CI is ready. Running checks..."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run stub tests
        run: pytest -q
        timeout-minutes: 5

      - name: Run main.py
        run: python src/main.py
        timeout-minutes: 1
