name: Driver Service CI

on:
  pull_request:
    branches:
      - 'driver-service'
      - 'main'
    paths:
      - 'driver-service/**'
      - '.github/workflows/driver-service-ci.yml'

  push:
    branches:
      - 'driver-service'
      - 'main'
    paths:
      - 'driver-service/**'
      - '.github/workflows/driver-service-ci.yml'
    tags:
      - 'driver-service/v*'

  workflow_dispatch:

env:
  SHOULD_PUSH_IMAGE: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: driver-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: ${{ github.event_name == 'push' && 'pip' || '' }}
          cache-dependency-path: 'driver-service/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Syntax check
        run: python -m compileall -q src

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    outputs:
      image_uri: ${{ steps.login-ecr.outputs.registry }}/drive-ops/driver-service
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build-and-push.outputs.digest }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Training-GitHub-ECR-Push
        aws-region: us-east-2

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registries: ${{ secrets.AWS_ACCOUNT_ID }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: | 
          ${{ steps.login-ecr.outputs.registry }}/drive-ops/driver-service
        tags: | 
          type=sha
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=dev,enable=${{ github.ref == 'refs/heads/driver-service' }}
          type=match,pattern=driver-service/v(.*),group=1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and push
      id: build-and-push
      uses: docker/build-push-action@v6
      with:
        context: driver-service
        file: driver-service/Dockerfile
        push: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=driver-service
        cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=driver-service' || '' }}

    - name: Export build metadata
      if: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
      run: |
        mkdir -p build-artifacts
        echo "image_uri=${{ steps.login-ecr.outputs.registry }}/drive-ops/driver-service" > build-artifacts/metadata.env
        echo "image_tag=${{ steps.meta.outputs.version }}" >> build-artifacts/metadata.env
        echo "image_digest=${{ steps.build-and-push.outputs.digest }}" >> build-artifacts/metadata.env
        
        jq -n \
          --arg uri "${{ steps.login-ecr.outputs.registry }}/drive-ops/driver-service" \
          --arg tag "${{ steps.meta.outputs.version }}" \
          --arg digest "${{ steps.build-and-push.outputs.digest }}" \
          '{uri: $uri, tag: $tag, digest: $digest}' > build-artifacts/metadata.json

    - name: Upload build metadata
      if: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
      uses: actions/upload-artifact@v6
      with:
        name: driver-service-metadata
        path: build-artifacts/