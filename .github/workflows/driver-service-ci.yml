name: Driver Service CI

on:
  pull_request:
    branches:
      - 'driver-service'
      - 'main'
    paths:
      - 'driver-service/**'
      - '.github/workflows/driver-service-ci.yml'

  push:
    branches:
      - 'driver-service'
      - 'main'
    paths:
      - 'driver-service/**'
      - '.github/workflows/driver-service-ci.yml'
    tags:
      - 'driver-service/v*'

env:
  SHOULD_PUSH_IMAGE: ${{ github.event_name == 'push' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: driver-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'driver-service/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Syntax check
        run: python -m compileall -q src

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: | 
          ghcr.io/${{ github.repository_owner }}/driver-service
        tags: | 
          type=sha
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=dev,enable=${{ github.ref == 'refs/heads/driver-service' }}
          type=match,pattern=driver-service/v(.*),group=1

    - name: Login to GHCR
      if: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: driver-service
        file: driver-service/Dockerfile
        push: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=driver-service
        cache-to: type=gha,mode=max,scope=driver-service
