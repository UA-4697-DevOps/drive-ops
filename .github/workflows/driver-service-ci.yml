name: Driver Service CI

on:
  push:
    paths:
      - "driver-service/**"
      - ".github/workflows/driver-service-ci.yml"
  pull_request:
    paths:
      - "driver-service/**"
      - ".github/workflows/driver-service-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Infrastructure Stub
        run: echo "Driver Service CI is ready. Running checks..."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run stub tests
        run: pytest -q
        timeout-minutes: 5

      - name: Run main.py
        run: python src/main.py
        timeout-minutes: 1

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: | 
          ghcr.io/${{ github.repository_owner }}/driver-service
        tags: | 
          type=sha
          type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_name == 'main' }}

    - name: Login to GHCR
      if: github.event_name == 'push' && github.ref_name == 'main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: driver-service
        file: driver-service/Dockerfile
        push: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
