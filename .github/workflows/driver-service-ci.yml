name: Driver Service CI

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'driver-service/**'
      - '.github/workflows/driver-service-ci.yml'

  push:
    branches:
      - 'main'
    paths:
      - 'driver-service/**'
      - '.github/workflows/driver-service-ci.yml'
    tags:
      - 'driver-service/v*'

  workflow_dispatch:

env:
  ECR_REPOSITORY: driver-service
  SHOULD_PUSH_IMAGE: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: driver-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: ${{ github.event_name == 'push' && 'pip' || '' }}
          cache-dependency-path: 'driver-service/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Syntax check
        run: python -m compileall -q src

  infra-tests:
    name: Infrastructure Tests
    runs-on: ubuntu-latest
    env:
      GO_VERSION: '1.25.6'
      TERRAFORM_VERSION: '1.10.0'
      TERRAGRUNT_VERSION: '0.68.0'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: infra/terratest/go.sum

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64 -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Run Driver Service Infra Tests
        working-directory: infra/terratest
        run: go test -v -timeout 10m -run TestDriverServiceInfra
        env:
          TG_SKIP_AWS_VALIDATION: "true"
          AWS_ACCESS_KEY_ID: "testing"
          AWS_SECRET_ACCESS_KEY: "testing"
          AWS_DEFAULT_REGION: "us-east-2"

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    outputs:
      image_uri: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build-and-push.outputs.digest }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Training-GitHub-ECR-Push
        aws-region: us-east-2

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registries: ${{ secrets.AWS_ACCOUNT_ID }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        tags: |
          type=sha
          type=match,pattern=driver-service/v(.*),group=1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      id: build-and-push
      uses: docker/build-push-action@v6
      with:
        context: driver-service
        file: driver-service/Dockerfile
        push: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=driver-service
        cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=driver-service' || '' }}

    - name: Export build metadata
      if: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
      run: |
        mkdir -p build-artifacts

        URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
        TAG="${{ steps.meta.outputs.version }}"
        DIGEST="${{ steps.build-and-push.outputs.digest }}"

        echo "image_uri=$URI" > build-artifacts/metadata.env
        echo "image_tag=$TAG" >> build-artifacts/metadata.env
        echo "image_digest=$DIGEST" >> build-artifacts/metadata.env

        jq -n \
          --arg uri "$URI" \
          --arg tag "$TAG" \
          --arg digest "$DIGEST" \
          '{uri: $uri, tag: $tag, digest: $digest}' > build-artifacts/metadata.json

    - name: Upload build metadata
      if: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
      uses: actions/upload-artifact@v6
      with:
        name: driver-service-metadata
        path: build-artifacts/
