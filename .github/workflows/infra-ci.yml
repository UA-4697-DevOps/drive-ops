name: Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - 'infra/terragrunt/**'
      - 'infra/terratest/**'
      - '.github/workflows/infra-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - 'infra/terragrunt/**'
      - 'infra/terratest/**'
      - '.github/workflows/infra-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: '1.10.0'
  TERRAGRUNT_VERSION: '0.68.0'
  GO_VERSION: '1.25'

jobs:
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff
        working-directory: infra/terraform

  terratest-plan:
    name: TripService Terratest (Plan)
    runs-on: ubuntu-latest
    needs: terraform-fmt # Run after format check passes
    steps:
      - uses: actions/checkout@v6

      # 1. Setup Go (Required for running the test)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # 2. Setup Terraform (Required for the test to run 'terraform plan')
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false # Important for Terratest parsing

      # 3. Run the Test
      - name: Run TripService Plan Test
        working-directory: infra/terratest
        run: |
          go mod download
          go test -v -run TestTripServiceDependencies

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: terraform-fmt

    strategy:
      fail-fast: false
      matrix:
        module:
          - shared-infra
          - rds
          - state-backend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: infra/terraform/modules/${{ matrix.module }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/terraform/modules/${{ matrix.module }}

  terragrunt-validate:
    name: Terragrunt Validate
    runs-on: ubuntu-latest
    needs: terraform-fmt

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -sL https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64 -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Terragrunt HCL Format Check
        run: terragrunt hclfmt --check
        working-directory: infra/terragrunt

      - name: Terragrunt Validate All
        run: |
          # List of specific modules to validate following the infrastructure refactor
          modules=(
            "envs/dev/shared-infra"
            "envs/dev/rds"
            "envs/dev/state-backend"
          )

          for dir in "${modules[@]}"; do
            if [ -d "$dir" ]; then
              echo "Validating directory: $dir..."
              cd "$dir"
              # Initialize with -backend=false to skip S3 backend initialization (no AWS creds needed)
              terragrunt validate --terragrunt-non-interactive --terragrunt-init-flag="-backend=false"
              cd - > /dev/null
            else
              echo "Error: Directory $dir not found! Please check your folder structure."
              # Terminate the workflow if a required module directory is missing
              exit 1
            fi
          done
        working-directory: infra/terragrunt
        env:
          # Use dummy credentials for offline validation
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_DEFAULT_REGION: us-east-2
          
          # --- Fix for STS:GetCallerIdentity 403 Errors ---
          # These variables tell the AWS Provider to skip real credential validation
          AWS_SKIP_CREDENTIALS_VALIDATION: "true"
          AWS_SKIP_REGION_CHECK: "true"
          AWS_SKIP_METADATA_API_CHECK: "true"
          
          # Prevents Terragrunt from trying to call AWS STS during the validation phase
          TG_SKIP_AWS_VALIDATION: "true"
