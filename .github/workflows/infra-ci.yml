name: Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - 'infra/terragrunt/**'
      - '.github/workflows/infra-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - 'infra/terragrunt/**'
      - '.github/workflows/infra-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: '1.10.0'
  TERRAGRUNT_VERSION: '0.68.0'

jobs:
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff
        working-directory: infra/terraform

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: terraform-fmt

    strategy:
      fail-fast: false
      matrix:
        module:
          - vpc
          - sqs
          - state-backend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: infra/terraform/modules/${{ matrix.module }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/terraform/modules/${{ matrix.module }}

  terragrunt-validate:
    name: Terragrunt Validate
    runs-on: ubuntu-latest
    needs: terraform-fmt

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -sL https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64 -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Terragrunt HCL Format Check
        run: terragrunt hclfmt --terragrunt-check
        working-directory: infra/terragrunt

      - name: Terragrunt Validate All
        run: |
          # Validate each terragrunt module (skip backend since it requires AWS creds)
          for dir in envs/dev/vpc envs/dev/sqs-*; do
            if [ -d "$dir" ]; then
              echo "Validating $dir..."
              cd "$dir"
              terragrunt validate --terragrunt-non-interactive --terragrunt-init-flag="-backend=false"
              cd - > /dev/null
            fi
          done
        working-directory: infra/terragrunt
        env:
          # Provide dummy values for validation (no real AWS access needed)
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_DEFAULT_REGION: eu-central-1
