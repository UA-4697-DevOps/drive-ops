name: Terratest - Client Gateway

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/terraform/modules/client-gateway/**'
      - 'infra/terratest/client_gateway_test.go'
      - '.github/workflows/terratest-client-gateway.yml'
  
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terratest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Training-GitHub-ECR-Push
          aws-region: us-east-2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
          terraform_wrapper: false

      - name: Run ClientGateway Terratest
        working-directory: infra/terratest
        run: |
          go test -v -run TestClientGateway -timeout 15m 2>&1 | tee test-results.log
        env:
          AWS_DEFAULT_REGION: us-east-2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: terratest-results
          path: infra/terratest/test-results.log
