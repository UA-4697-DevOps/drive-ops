# ---------------------------------------------------------
# Client Gateway — Manual Deploy to AWS Dev
# ---------------------------------------------------------
# Deploys a specific image tag to the dev EC2 instance via
# SSM Run Command, then validates health + SQS connectivity
# for the driver-command flow.  Rolls back automatically if
# post-deploy checks fail.
#
# Prerequisites (one-time, before first deploy):
#   1. EC2 instance tagged  Service=client-gateway, Environment=dev
#      with SSM Agent running and an instance profile that allows
#      ssm:SendCommand / ssm:GetCommandInvocation.
#   2. SSM Parameter Store values:
#        /drive-ops/dev/client-gateway/trip-service-url
#        /drive-ops/dev/client-gateway/driver-service-url
#   3. Secrets Manager secret:
#        drive-ops/dev/client-gateway/telegram-token
#   4. ECR image already pushed by client-gateway-ci.yml.
# ---------------------------------------------------------

name: Client Gateway Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: >
          ECR image tag to deploy (e.g. sha-abc1234).
          Leave empty to deploy the latest image from ECR.
        required: false
        type: string
        default: ''
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
        default: dev

concurrency:
  group: deploy-client-gateway-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: client-gateway
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  DEPLOY_ENV: ${{ github.event.inputs.environment }}
  SERVICE_NAME: client-gateway
  COMPOSE_SERVICE: client-gateway
  CONTAINER_NAME: client-gateway-bot
  APP_DIR: /opt/drive-ops
  HEALTH_PORT: 8080

permissions:
  id-token: write
  contents: read

jobs:
  # -------------------------------------------------------
  # 1. Resolve image tag and capture current (pre-deploy)
  # -------------------------------------------------------
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_uri: ${{ steps.resolve.outputs.image_uri }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      previous_image: ${{ steps.previous.outputs.previous_image }}
      instance_id: ${{ steps.instance.outputs.instance_id }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/client-gateway-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: resolve
        run: |
          REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          REPO="${REGISTRY}/${{ env.ECR_REPOSITORY }}"

          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            # Fetch the latest image tag pushed to ECR
            TAG=$(aws ecr describe-images \
              --repository-name "${{ env.ECR_REPOSITORY }}" \
              --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' \
              --output text)
            if [ -z "$TAG" ] || [ "$TAG" = "None" ]; then
              echo "::error::No images found in ECR repository ${{ env.ECR_REPOSITORY }}"
              exit 1
            fi
          fi

          echo "image_uri=${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "### 🐳 Image to deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${REPO}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids imageTag="${{ steps.resolve.outputs.image_tag }}" \
            > /dev/null 2>&1 \
          || { echo "::error::Image tag ${{ steps.resolve.outputs.image_tag }} not found in ECR"; exit 1; }

      - name: Find target EC2 instance
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Service,Values=${{ env.SERVICE_NAME }}" \
              "Name=tag:Environment,Values=${{ env.DEPLOY_ENV }}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No running EC2 instance found with tags Service=${{ env.SERVICE_NAME }}, Environment=${{ env.DEPLOY_ENV }}"
            exit 1
          fi

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "### 🖥️ Target instance" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${INSTANCE_ID}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture previous image tag
        id: previous
        run: |
          # Ask the running container for its current image via SSM
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker inspect --format={{.Config.Image}} ${{ env.CONTAINER_NAME }} 2>/dev/null || echo none"]' \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            2>/dev/null || true

          PREV=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query 'StandardOutputContent' \
            --output text | tr -d '[:space:]')

          echo "previous_image=${PREV}" >> "$GITHUB_OUTPUT"
          echo "### 🔄 Previous image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${PREV}\`" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------
  # 2. Deploy — SSM-run Compose update
  # -------------------------------------------------------
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 10
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/client-gateway-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Inject configuration & deploy via SSM
        id: ssm_deploy
        run: |
          INSTANCE_ID="${{ needs.prepare.outputs.instance_id }}"
          IMAGE="${{ needs.prepare.outputs.image_uri }}"

          # Fetch configuration from SSM Parameter Store
          TRIP_URL=$(aws ssm get-parameter \
            --name "/drive-ops/${{ env.DEPLOY_ENV }}/client-gateway/trip-service-url" \
            --query 'Parameter.Value' --output text)

          DRIVER_URL=$(aws ssm get-parameter \
            --name "/drive-ops/${{ env.DEPLOY_ENV }}/client-gateway/driver-service-url" \
            --query 'Parameter.Value' --output text)

          # Fetch Telegram bot token from Secrets Manager
          BOT_TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id "drive-ops/${{ env.DEPLOY_ENV }}/client-gateway/telegram-token" \
            --query 'SecretString' --output text)

          # Build the remote deploy script
          read -r -d '' DEPLOY_SCRIPT << 'DEPLOY_EOF' || true
          set -euo pipefail

          APP_DIR="__APP_DIR__"
          IMAGE="__IMAGE__"
          SERVICE="__SERVICE__"
          TRIP_URL="__TRIP_URL__"
          DRIVER_URL="__DRIVER_URL__"
          BOT_TOKEN="__BOT_TOKEN__"
          AWS_REGION="__AWS_REGION__"
          ECR_REGISTRY="__ECR_REGISTRY__"

          echo ">>> Authenticating with ECR..."
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

          echo ">>> Pulling image ${IMAGE}..."
          docker pull "${IMAGE}"

          echo ">>> Updating .env with injected configuration..."
          cd "${APP_DIR}"

          # Update or add each variable in .env (create file if missing)
          touch .env
          for VAR_LINE in \
            "TRIP_SERVICE_URL=${TRIP_URL}" \
            "DRIVER_SERVICE_URL=${DRIVER_URL}" \
            "TELEGRAM_BOT_TOKEN=${BOT_TOKEN}"; do
            VAR_KEY="${VAR_LINE%%=*}"
            if grep -q "^${VAR_KEY}=" .env; then
              sed -i "s|^${VAR_KEY}=.*|${VAR_LINE}|" .env
            else
              echo "${VAR_LINE}" >> .env
            fi
          done

          echo ">>> Deploying ${SERVICE} with image ${IMAGE}..."
          IMAGE="${IMAGE}" docker compose up -d --no-deps --force-recreate "${SERVICE}"

          echo ">>> Waiting for container to become healthy..."
          SECONDS=0
          TIMEOUT=120
          while [ $SECONDS -lt $TIMEOUT ]; do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "__CONTAINER__" 2>/dev/null || echo "missing")
            case "$HEALTH" in
              healthy)
                echo ">>> Container is healthy after ${SECONDS}s"
                exit 0
                ;;
              unhealthy)
                echo "::error::Container entered unhealthy state"
                docker logs --tail 30 "__CONTAINER__"
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "::error::Container did not become healthy within ${TIMEOUT}s"
          docker logs --tail 30 "__CONTAINER__"
          exit 1
          DEPLOY_EOF

          # Substitute placeholders
          ECR_REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__APP_DIR__/${{ env.APP_DIR }}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__IMAGE__/${IMAGE}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__SERVICE__/${{ env.COMPOSE_SERVICE }}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__TRIP_URL__/${TRIP_URL}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__DRIVER_URL__/${DRIVER_URL}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__BOT_TOKEN__/${BOT_TOKEN}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__AWS_REGION__/${{ env.AWS_REGION }}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__ECR_REGISTRY__/${ECR_REGISTRY}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__CONTAINER__/${{ env.CONTAINER_NAME }}}"

          # Execute via SSM
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --parameters commands=["$(echo "$DEPLOY_SCRIPT" | base64 -w0 | xargs -I{} echo 'echo {} | base64 -d | bash')"] \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${CMD_ID}"

          # Wait for completion
          echo ">>> Waiting for SSM command to complete..."
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            2>/dev/null || true

          # Retrieve result
          RESULT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID")

          STATUS=$(echo "$RESULT" | jq -r '.Status')
          echo "### 🚀 Deploy SSM Command" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: \`${STATUS}\`" >> "$GITHUB_STEP_SUMMARY"

          STDOUT=$(echo "$RESULT" | jq -r '.StandardOutputContent')
          STDERR=$(echo "$RESULT" | jq -r '.StandardErrorContent')

          echo "--- stdout ---"
          echo "$STDOUT"
          if [ -n "$STDERR" ] && [ "$STDERR" != "" ]; then
            echo "--- stderr ---"
            echo "$STDERR"
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM deploy command failed with status ${STATUS}"
            exit 1
          fi

  # -------------------------------------------------------
  # 3. Verify — health check + SQS connectivity
  # -------------------------------------------------------
  verify:
    name: Post-deploy Verification
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    timeout-minutes: 5
    outputs:
      healthy: ${{ steps.health.outputs.healthy }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/client-gateway-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Health check via SSM
        id: health
        run: |
          INSTANCE_ID="${{ needs.prepare.outputs.instance_id }}"

          read -r -d '' HEALTH_SCRIPT << 'EOF' || true
          set -euo pipefail

          MAX_ATTEMPTS=5
          DELAY=10
          URL="http://localhost:__PORT__/health"

          echo ">>> Running health check against ${URL}..."
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "  Attempt ${i}/${MAX_ATTEMPTS}..."
            HTTP_CODE=$(curl -sf -o /tmp/health_body.json -w '%{http_code}' "${URL}" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              BODY=$(cat /tmp/health_body.json)
              STATUS=$(echo "$BODY" | jq -r '.status // empty')
              if [ "$STATUS" = "ok" ] || [ "$STATUS" = "healthy" ]; then
                echo ">>> Health check passed: ${BODY}"
                exit 0
              else
                echo "  Unexpected response body: ${BODY}"
              fi
            else
              echo "  HTTP ${HTTP_CODE}"
            fi

            [ "$i" -lt "$MAX_ATTEMPTS" ] && sleep "$DELAY"
          done

          echo "::error::Health check failed after ${MAX_ATTEMPTS} attempts"
          exit 1
          EOF

          HEALTH_SCRIPT="${HEALTH_SCRIPT//__PORT__/${{ env.HEALTH_PORT }}}"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 120 \
            --parameters commands=["$(echo "$HEALTH_SCRIPT" | base64 -w0 | xargs -I{} echo 'echo {} | base64 -d | bash')"] \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            2>/dev/null || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID")

          STATUS=$(echo "$RESULT" | jq -r '.Status')
          STDOUT=$(echo "$RESULT" | jq -r '.StandardOutputContent')
          echo "$STDOUT"

          if [ "$STATUS" = "Success" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            echo "### ✅ Health Check Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            STDERR=$(echo "$RESULT" | jq -r '.StandardErrorContent')
            echo "### ❌ Health Check Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$STDOUT" >> "$GITHUB_STEP_SUMMARY"
            echo "$STDERR" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Health check failed"
            exit 1
          fi

      - name: SQS connectivity check
        id: sqs_check
        run: |
          # Client-gateway itself does not use SQS, but downstream
          # services (driver-service, trip-service) rely on these queues
          # for the driver-command flow.  Verify IAM/network access to
          # confirm the broader system is operational after deploy.

          QUEUES=(
            "trip-created-${{ env.DEPLOY_ENV }}.fifo"
            "driver-assigned-${{ env.DEPLOY_ENV }}.fifo"
            "trip-completed-${{ env.DEPLOY_ENV }}.fifo"
          )

          echo "### SQS Queue Connectivity" >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          for QUEUE_NAME in "${QUEUES[@]}"; do
            QUEUE_URL=$(aws sqs get-queue-url \
              --queue-name "$QUEUE_NAME" \
              --query 'QueueUrl' --output text 2>/dev/null) || true

            if [ -z "$QUEUE_URL" ] || [ "$QUEUE_URL" = "None" ]; then
              echo "::warning::Queue not found: ${QUEUE_NAME}"
              echo "- ⚠️ \`${QUEUE_NAME}\` — not found" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
              continue
            fi

            # Lightweight attribute fetch to confirm IAM permissions
            ATTRS=$(aws sqs get-queue-attributes \
              --queue-url "$QUEUE_URL" \
              --attribute-names ApproximateNumberOfMessages \
              --query 'Attributes.ApproximateNumberOfMessages' \
              --output text 2>/dev/null) || true

            if [ -n "$ATTRS" ] && [ "$ATTRS" != "None" ]; then
              echo "- ✅ \`${QUEUE_NAME}\` — accessible (msgs: ${ATTRS})" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Cannot read attributes for queue: ${QUEUE_NAME}"
              echo "- ⚠️ \`${QUEUE_NAME}\` — access denied or error" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::warning::One or more SQS queues are not accessible. Driver-command flow may be impacted."
          fi

  # -------------------------------------------------------
  # 4. Rollback — redeploy previous image if verify fails
  # -------------------------------------------------------
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [prepare, deploy, verify]
    if: failure() && needs.deploy.result == 'success'
    timeout-minutes: 10
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/client-gateway-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollback to previous image
        run: |
          INSTANCE_ID="${{ needs.prepare.outputs.instance_id }}"
          PREV_IMAGE="${{ needs.prepare.outputs.previous_image }}"

          if [ -z "$PREV_IMAGE" ] || [ "$PREV_IMAGE" = "none" ]; then
            echo "::error::No previous image recorded — cannot rollback"
            exit 1
          fi

          echo "### ⏪ Rolling back to ${PREV_IMAGE}" >> "$GITHUB_STEP_SUMMARY"

          read -r -d '' ROLLBACK_SCRIPT << 'EOF' || true
          set -euo pipefail

          APP_DIR="__APP_DIR__"
          IMAGE="__IMAGE__"
          SERVICE="__SERVICE__"
          AWS_REGION="__AWS_REGION__"
          ECR_REGISTRY="__ECR_REGISTRY__"

          echo ">>> Authenticating with ECR..."
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

          echo ">>> Pulling previous image ${IMAGE}..."
          docker pull "${IMAGE}"

          cd "${APP_DIR}"

          echo ">>> Rolling back ${SERVICE} to ${IMAGE}..."
          IMAGE="${IMAGE}" docker compose up -d --no-deps --force-recreate "${SERVICE}"

          echo ">>> Waiting for container health..."
          SECONDS=0
          TIMEOUT=120
          while [ $SECONDS -lt $TIMEOUT ]; do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "__CONTAINER__" 2>/dev/null || echo "missing")
            case "$HEALTH" in
              healthy)
                echo ">>> Rollback container is healthy after ${SECONDS}s"
                exit 0
                ;;
              unhealthy)
                echo "::error::Rollback container entered unhealthy state"
                docker logs --tail 30 "__CONTAINER__"
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "::error::Rollback container did not become healthy within ${TIMEOUT}s"
          exit 1
          EOF

          ECR_REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          ROLLBACK_SCRIPT="${ROLLBACK_SCRIPT//__APP_DIR__/${{ env.APP_DIR }}}"
          ROLLBACK_SCRIPT="${ROLLBACK_SCRIPT//__IMAGE__/${PREV_IMAGE}}"
          ROLLBACK_SCRIPT="${ROLLBACK_SCRIPT//__SERVICE__/${{ env.COMPOSE_SERVICE }}}"
          ROLLBACK_SCRIPT="${ROLLBACK_SCRIPT//__AWS_REGION__/${{ env.AWS_REGION }}}"
          ROLLBACK_SCRIPT="${ROLLBACK_SCRIPT//__ECR_REGISTRY__/${ECR_REGISTRY}}"
          ROLLBACK_SCRIPT="${ROLLBACK_SCRIPT//__CONTAINER__/${{ env.CONTAINER_NAME }}}"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --parameters commands=["$(echo "$ROLLBACK_SCRIPT" | base64 -w0 | xargs -I{} echo 'echo {} | base64 -d | bash')"] \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${CMD_ID}"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            2>/dev/null || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID")

          STATUS=$(echo "$RESULT" | jq -r '.Status')
          STDOUT=$(echo "$RESULT" | jq -r '.StandardOutputContent')
          echo "$STDOUT"

          if [ "$STATUS" = "Success" ]; then
            echo "### ✅ Rollback Succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            STDERR=$(echo "$RESULT" | jq -r '.StandardErrorContent')
            echo "### ❌ Rollback Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$STDERR" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Rollback failed — manual intervention required"
            exit 1
          fi

      - name: Verify rollback health
        run: |
          INSTANCE_ID="${{ needs.prepare.outputs.instance_id }}"

          read -r -d '' CHECK << 'EOF' || true
          set -euo pipefail
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:__PORT__/health 2>/dev/null || echo "000")
            [ "$HTTP_CODE" = "200" ] && echo "Rollback health OK" && exit 0
            sleep 5
          done
          echo "Rollback health check failed"
          exit 1
          EOF

          CHECK="${CHECK//__PORT__/${{ env.HEALTH_PORT }}}"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 60 \
            --parameters commands=["$(echo "$CHECK" | base64 -w0 | xargs -I{} echo 'echo {} | base64 -d | bash')"] \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            2>/dev/null || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)

          if [ "$RESULT" != "Success" ]; then
            echo "::error::Rollback health check failed — manual intervention required"
            exit 1
          fi

          echo "### ✅ Rollback health verified" >> "$GITHUB_STEP_SUMMARY"
