name: Deploy Driver Service via SSM

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
  
  workflow_call:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string
        default: 'dev'

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: drive-ops/driver-service
  SSM_DOCUMENT_NAME: drive-ops-${{ inputs.environment }}-driver-service-deploy

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy via SSM Run Command
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Training-GitHub-ECR-Push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Verify image exists in ECR
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image_tag }}"
          echo "Checking if image exists: $IMAGE_URI"
          if aws ecr describe-images --repository-name ${{ env.ECR_REPOSITORY }} --image-ids imageTag=${{ inputs.image_tag }} --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "Image found in ECR"
            echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          else
            echo "ERROR: Image tag not found in ECR"
            exit 1
          fi

      - name: Get EC2 instance ID
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=drive-ops-${{ inputs.environment }}-driver-service-host" ...
          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: No running EC2 instance found"
            exit 1
          fi
          echo "Instance ID: $INSTANCE_ID"
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Get current running image tag
        id: get-current-tag
        run: |
          echo "Getting current running image tag for rollback"
          CURRENT_TAG=$(aws ssm send-command \
            --instance-ids ${{ env.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker inspect driver-service --format=\"{{.Config.Image}}\" | cut -d\":\" -f2"]' \
            --region ${{ env.AWS_REGION }} \
            --output text \
            --query 'Command.CommandId')
          
          aws ssm wait command-executed \
            --command-id $CURRENT_TAG \
            --instance-id ${{ env.INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }}
          
          PREVIOUS_TAG=$(aws ssm get-command-invocation \
            --command-id $CURRENT_TAG \
            --instance-id ${{ env.INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }} \
            --query 'StandardOutputContent' \
            --output text | tr -d '\n')
          
          echo "Current running tag: $PREVIOUS_TAG"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_ENV

      - name: Deploy service via SSM
        id: deploy
        run: |
          echo "Deploying driver-service with image tag: ${{ inputs.image_tag }}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ env.INSTANCE_ID }} \
            --document-name ${{ env.SSM_DOCUMENT_NAME }} \
            --parameters ImageTag=${{ inputs.image_tag }},EcrRepository=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --output text \
            --query 'Command.CommandId')
          
          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
          
          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id ${{ env.INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }}
          
          echo "Command execution completed"

      - name: Verify service health
        id: health-check
        run: |
          echo "Waiting for service to become healthy"
          sleep 30
          
          INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          echo "Checking health at: http://$INSTANCE_IP:8082/health"
          
          for i in {1..10}; do
            if curl -f -s "http://$INSTANCE_IP:8082/health"; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s"
            sleep 10
          done
          
          echo "Health check failed after 10 attempts"
          exit 1

      - name: Verify SQS access
        id: sqs-check
        if: success()
        run: |
          echo "Verifying SQS access from EC2 instance"
          
          SQS_QUEUE_URL="https://sqs.${{ env.AWS_REGION }}.amazonaws.com/${{ secrets.AWS_ACCOUNT_ID }}/trip-created-dev.fifo"
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ env.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['aws sqs get-queue-attributes --queue-url $SQS_QUEUE_URL --attribute-names QueueArn --region ${{ env.AWS_REGION }}']" \
            --region ${{ env.AWS_REGION }} \
            --output text \
            --query 'Command.CommandId')
          
          sleep 5
          
          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ env.INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Status' \
            --output text)
          
          if [ "$STATUS" = "Success" ]; then
            echo "SQS access check passed"
          else
            echo "SQS access check failed"
            exit 1
          fi

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "Deployment failed, initiating rollback to previous image: ${{ env.PREVIOUS_TAG }}"
          
          if [ -z "${{ env.PREVIOUS_TAG }}" ] || [ "${{ env.PREVIOUS_TAG }}" = "null" ]; then
            echo "No previous tag found, cannot rollback"
            exit 0
          fi
          
          echo "Rolling back to tag: ${{ env.PREVIOUS_TAG }}"
          
          ROLLBACK_COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ env.INSTANCE_ID }} \
            --document-name ${{ env.SSM_DOCUMENT_NAME }} \
            --parameters ImageTag=${{ env.PREVIOUS_TAG }},EcrRepository=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --output text \
            --query 'Command.CommandId')
          
          echo "Rollback Command ID: $ROLLBACK_COMMAND_ID"
          
          aws ssm wait command-executed \
            --command-id $ROLLBACK_COMMAND_ID \
            --instance-id ${{ env.INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }}
          
          echo "Rollback completed successfully"

      - name: Deployment summary
        if: always()
        run: |
          echo "Deployment Summary"
          echo "Target Image: ${{ env.IMAGE_URI }}"
          echo "Previous Image: ${{ env.PREVIOUS_TAG }}"
          echo "Instance: ${{ env.INSTANCE_ID }}"
          echo "SSM Document: ${{ env.SSM_DOCUMENT_NAME }}"
          echo "Status: ${{ job.status }}"
