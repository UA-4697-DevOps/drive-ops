# ---------------------------------------------------------
# Driver Service — Manual Deploy to AWS Dev
# ---------------------------------------------------------
# Deploys a specific image tag to the dev EC2 instance via
# SSM Run Command, then validates health + SQS connectivity.
# Rolls back automatically if post-deploy checks fail.
#
# Prerequisites (one-time, before first deploy):
#   1. EC2 instance tagged  Service=driver-service, Environment=dev
#      with SSM Agent running and an instance profile that allows:
#        - ssm:SendCommand / ssm:GetCommandInvocation
#        - ssm:GetParameter on /drive-ops/<env>/driver-service/*
#        - secretsmanager:GetSecretValue on RDS credentials
#        - sqs:* on trip queues
#   2. SSM Parameter Store values:
#        /drive-ops/dev/sqs/trip-created-url
#        /drive-ops/dev/sqs/driver-assigned-url
#        /drive-ops/dev/sqs/trip-completed-url
#   3. Secrets Manager secret:
#        drive-ops-dev-rds-master
#   4. ECR image already pushed by driver-service-ci.yml.
# ---------------------------------------------------------

name: Driver Service Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: >
          ECR image tag to deploy (e.g. sha-abc1234).
          Leave empty to deploy the latest image from ECR.
        required: false
        type: string
        default: ''
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
        default: dev

concurrency:
  group: deploy-driver-service-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: driver-service
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  DEPLOY_ENV: ${{ github.event.inputs.environment }}
  SERVICE_NAME: driver-service
  CONTAINER_NAME: driver-service
  HEALTH_PORT: 8082

permissions:
  id-token: write
  contents: read

jobs:
  # -------------------------------------------------------
  # 1. Resolve image tag and capture current (pre-deploy)
  # -------------------------------------------------------
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_uri: ${{ steps.resolve.outputs.image_uri }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      previous_image: ${{ steps.previous.outputs.previous_image }}
      instance_id: ${{ steps.instance.outputs.instance_id }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.SERVICE_NAME }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: resolve
        env:
          IMAGE_TAG_INPUT: ${{ github.event.inputs.image_tag }}
        run: |
          REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          REPO="${REGISTRY}/${{ env.ECR_REPOSITORY }}"

          if [ -n "${IMAGE_TAG_INPUT}" ]; then
            TAG="${IMAGE_TAG_INPUT}"
          else
            # Fetch the latest image tag pushed to ECR, preferring deterministic sha-* tags
            LATEST_IMAGE=$(aws ecr describe-images \
              --repository-name "${{ env.ECR_REPOSITORY }}" \
              --query 'sort_by(imageDetails,& imagePushedAt)[-1]' \
              --output json)
            
            # Try to find a sha-* tag (most deterministic)
            TAG=$(echo "$LATEST_IMAGE" | jq -r '.imageTags[] | select(. | startswith("sha-")) | .' | head -1)
            
            # If no sha-* tag found, use imageDigest as fallback
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              IMAGE_DIGEST=$(echo "$LATEST_IMAGE" | jq -r '.imageDigest // empty')
              if [ -z "$IMAGE_DIGEST" ]; then
                # Last resort: use first available tag from imageTags
                TAG=$(echo "$LATEST_IMAGE" | jq -r '.imageTags[0] // empty')
              else
                # Use digest-based lookup to get a proper tag reference
                TAG=$(aws ecr batch-get-image \
                  --repository-name "${{ env.ECR_REPOSITORY }}" \
                  --image-ids imageDigest="$IMAGE_DIGEST" \
                  --query 'images[0].imageId.imageTag // images[0].imageId.imageDigest' \
                  --output text)
              fi
            fi
            
            if [ -z "$TAG" ] || [ "$TAG" = "None" ]; then
              echo "No images found in ECR repository ${{ env.ECR_REPOSITORY }}"
              exit 1
            fi
          fi

          echo "image_uri=${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "### 🐳 Image to deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${REPO}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids imageTag="${{ steps.resolve.outputs.image_tag }}" \
            > /dev/null 2>&1 \
          || { echo "Image tag ${{ steps.resolve.outputs.image_tag }} not found in ECR"; exit 1; }

      - name: Find target EC2 instance
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Service,Values=${{ env.SERVICE_NAME }}" \
              "Name=tag:Environment,Values=${{ env.DEPLOY_ENV }}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running EC2 instance found with tags Service=${{ env.SERVICE_NAME }}, Environment=${{ env.DEPLOY_ENV }}"
            exit 1
          fi

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "### 🖥️ Target instance" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${INSTANCE_ID}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture previous image tag
        id: previous
        run: |
          # Ask the running container for its current image via SSM
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker inspect --format={{.Config.Image}} ${{ env.CONTAINER_NAME }} 2>/dev/null || echo none"]' \
            --query 'Command.CommandId' \
            --output text)

          # Wait for command to complete
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            || echo "::warning::SSM wait timed out for previous image capture"

          # Check invocation status explicitly
          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}")

          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          case "$STATUS" in
            Success)
              PREV=$(echo "$INVOCATION" | jq -r '.StandardOutputContent' | tr -d '[:space:]')
              echo "previous_image=${PREV}" >> "$GITHUB_OUTPUT"
              ;;
            InProgress|TimedOut|Failed)
              echo "::warning::SSM command did not complete successfully (Status: $STATUS) — previous image unavailable for rollback"
              echo "previous_image=none" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected SSM invocation status: $STATUS"
              exit 1
              ;;
          esac
          echo "### 🔄 Previous image" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${STATUS}" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------
  # 2. Deploy — SSM Run Command using built-in SSM document
  # -------------------------------------------------------
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 10
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.SERVICE_NAME }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Document
        id: ssm_deploy
        run: |
          INSTANCE_ID="${{ needs.prepare.outputs.instance_id }}"
          IMAGE_TAG="${{ needs.prepare.outputs.image_tag }}"
          
          # Use the Terraform-created SSM document
          SSM_DOC_NAME="Training-drive-ops-${{ env.DEPLOY_ENV }}-driver-service-deploy"
          
          echo ">>> Deploying via SSM Document: ${SSM_DOC_NAME}"
          echo ">>> Image tag: ${IMAGE_TAG}"
          
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "${SSM_DOC_NAME}" \
            --parameters "ImageTag=${IMAGE_TAG}" \
            --timeout-seconds 300 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${CMD_ID}"

          # Wait for completion
          echo ">>> Waiting for SSM command to complete..."
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            2>/dev/null || true

          # Retrieve result
          RESULT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID")

          STATUS=$(echo "$RESULT" | jq -r '.Status')
          echo "### 🚀 Deploy SSM Command" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: \`${STATUS}\`" >> "$GITHUB_STEP_SUMMARY"

          STDOUT=$(echo "$RESULT" | jq -r '.StandardOutputContent')
          STDERR=$(echo "$RESULT" | jq -r '.StandardErrorContent')

          echo "--- stdout ---"
          echo "$STDOUT"
          if [ -n "$STDERR" ] && [ "$STDERR" != "" ]; then
            echo "--- stderr ---"
            echo "$STDERR"
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "SSM deploy command failed with status ${STATUS}"
            exit 1
          fi

  # -------------------------------------------------------
  # 3. Verify — health check + SQS connectivity
  # -------------------------------------------------------
  verify:
    name: Post-deploy Verification
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    timeout-minutes: 5
    outputs:
      healthy: ${{ steps.health.outputs.healthy }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.SERVICE_NAME }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Health check via SSM
        id: health
        run: |
          INSTANCE_ID="${{ needs.prepare.outputs.instance_id }}"

          read -r -d '' HEALTH_SCRIPT << 'HEALTH_EOF' || true
          set -euo pipefail

          MAX_ATTEMPTS=10
          DELAY=10
          URL="http://localhost:__PORT__/health"

          echo ">>> Running health check against ${URL}..."
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "  Attempt ${i}/${MAX_ATTEMPTS}..."
            HTTP_CODE=$(curl -sf -o /tmp/health_body.json -w '%{http_code}' "${URL}" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              BODY=$(cat /tmp/health_body.json)
              echo ">>> Health check passed: ${BODY}"
              exit 0
            else
              echo "  HTTP ${HTTP_CODE}"
            fi

            [ "$i" -lt "$MAX_ATTEMPTS" ] && sleep "$DELAY"
          done

          echo "Health check failed after ${MAX_ATTEMPTS} attempts"
          exit 1
          HEALTH_EOF

          HEALTH_SCRIPT="${HEALTH_SCRIPT//__PORT__/${{ env.HEALTH_PORT }}}"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 180 \
            --parameters commands=["$(echo "$HEALTH_SCRIPT" | base64 -w0 | xargs -I{} echo 'echo {} | base64 -d | bash')"] \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            2>/dev/null || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID")

          STATUS=$(echo "$RESULT" | jq -r '.Status')
          STDOUT=$(echo "$RESULT" | jq -r '.StandardOutputContent')
          echo "$STDOUT"

          if [ "$STATUS" = "Success" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            echo "### ✅ Health Check Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            STDERR=$(echo "$RESULT" | jq -r '.StandardErrorContent')
            echo "### ❌ Health Check Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$STDOUT" >> "$GITHUB_STEP_SUMMARY"
            echo "$STDERR" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Health check failed"
            exit 1
          fi

      - name: SQS connectivity check
        id: sqs_check
        continue-on-error: true
        run: |
          INSTANCE_ID="${{ needs.prepare.outputs.instance_id }}"

          read -r -d '' SQS_SCRIPT << 'SQS_EOF' || true
          set -euo pipefail

          QUEUES=(
            "trip-created-__DEPLOY_ENV__.fifo"
            "driver-assigned-__DEPLOY_ENV__.fifo"
            "trip-completed-__DEPLOY_ENV__.fifo"
          )

          echo "Checking SQS queue connectivity from EC2 instance..."
          FAILED=0

          for QUEUE_NAME in "${QUEUES[@]}"; do
            QUEUE_URL=$(aws sqs get-queue-url \
              --queue-name "$QUEUE_NAME" \
              --region __AWS_REGION__ \
              --query 'QueueUrl' --output text 2>/dev/null) || true

            if [ -z "$QUEUE_URL" ] || [ "$QUEUE_URL" = "None" ]; then
              echo "[⚠️] $QUEUE_NAME — not found"
              FAILED=1
              continue
            fi

            # Lightweight attribute fetch to confirm IAM permissions
            ATTRS=$(aws sqs get-queue-attributes \
              --queue-url "$QUEUE_URL" \
              --region __AWS_REGION__ \
              --attribute-names ApproximateNumberOfMessages \
              --query 'Attributes.ApproximateNumberOfMessages' \
              --output text 2>/dev/null) || true

            if [ -n "$ATTRS" ] && [ "$ATTRS" != "None" ]; then
              echo "[✅] $QUEUE_NAME — accessible (msgs: $ATTRS)"
            else
              echo "[⚠️] $QUEUE_NAME — cannot read attributes (access denied or error)"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 0 ]; then
            echo "All SQS queues accessible from EC2 instance"
            exit 0
          else
            echo "One or more SQS queues are not accessible from EC2 instance"
            exit 1
          fi
          SQS_EOF

          SQS_SCRIPT=$(echo "$SQS_SCRIPT" | sed "s|__DEPLOY_ENV__|${{ env.DEPLOY_ENV }}|g; s|__AWS_REGION__|${{ env.AWS_REGION }}|g")

          echo "Running SQS connectivity check on EC2 instance..."
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 120 \
            --parameters commands=["$(echo "$SQS_SCRIPT" | base64 -w0 | xargs -I{} echo 'echo {} | base64 -d | bash')"] \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${INSTANCE_ID}" \
            || echo "::warning::SSM SQS check timed out"

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${INSTANCE_ID}")

          STATUS=$(echo "$RESULT" | jq -r '.Status')
          STDOUT=$(echo "$RESULT" | jq -r '.StandardOutputContent')
          STDERR=$(echo "$RESULT" | jq -r '.StandardErrorContent')

          echo "$STDOUT"
          [ -n "$STDERR" ] && echo "$STDERR"

          echo "### SQS Queue Connectivity (EC2 Runtime)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" = "Success" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$STDOUT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "Status: $STATUS" >> "$GITHUB_STEP_SUMMARY"
            [ -n "$STDOUT" ] && echo "$STDOUT" >> "$GITHUB_STEP_SUMMARY"
            [ -n "$STDERR" ] && echo "$STDERR" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::SQS connectivity check failed on EC2 instance"
            exit 1
          fi

  # -------------------------------------------------------
  # 4. Rollback — redeploy previous image if health fails
  # -------------------------------------------------------
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [prepare, deploy, verify]
    if: failure() && needs.deploy.result == 'success' && needs.verify.outputs.healthy == 'false'
    timeout-minutes: 10
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.SERVICE_NAME }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollback to previous image
        run: |
          INSTANCE_ID="${{ needs.prepare.outputs.instance_id }}"
          PREV_IMAGE="${{ needs.prepare.outputs.previous_image }}"

          if [ -z "$PREV_IMAGE" ] || [ "$PREV_IMAGE" = "none" ]; then
            echo "No previous image recorded — cannot rollback"
            exit 1
          fi

          echo "### ⏪ Rolling back to ${PREV_IMAGE}" >> "$GITHUB_STEP_SUMMARY"

          # Extract tag from full image URI
          PREV_TAG="${PREV_IMAGE##*:}"
          
          # Use SSM document for rollback
          SSM_DOC_NAME="Training-drive-ops-${{ env.DEPLOY_ENV }}-driver-service-deploy"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "${SSM_DOC_NAME}" \
            --parameters "ImageTag=${PREV_TAG}" \
            --timeout-seconds 300 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Rollback Command ID: ${CMD_ID}"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            2>/dev/null || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID")

          STATUS=$(echo "$RESULT" | jq -r '.Status')
          STDOUT=$(echo "$RESULT" | jq -r '.StandardOutputContent')
          echo "$STDOUT"

          if [ "$STATUS" = "Success" ]; then
            echo "### ✅ Rollback Succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            STDERR=$(echo "$RESULT" | jq -r '.StandardErrorContent')
            echo "### ❌ Rollback Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$STDERR" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "Rollback failed — manual intervention required"
            exit 1
          fi

      - name: Verify rollback health
        run: |
          INSTANCE_ID="${{ needs.prepare.outputs.instance_id }}"

          read -r -d '' CHECK << 'CHECK_EOF' || true
          set -euo pipefail
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:__PORT__/health 2>/dev/null || echo "000")
            [ "$HTTP_CODE" = "200" ] && echo "Rollback health OK" && exit 0
            sleep 5
          done
          echo "Rollback health check failed"
          exit 1
          CHECK_EOF

          CHECK="${CHECK//__PORT__/${{ env.HEALTH_PORT }}}"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 60 \
            --parameters commands=["$(echo "$CHECK" | base64 -w0 | xargs -I{} echo 'echo {} | base64 -d | bash')"] \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            2>/dev/null || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)

          if [ "$RESULT" != "Success" ]; then
            echo "Rollback health check failed — manual intervention required"
            exit 1
          fi

          echo "### ✅ Rollback health verified" >> "$GITHUB_STEP_SUMMARY"
