name: 'Export Build Metadata'
description: 'Exports build metadata (image URI, tag, digest, commit SHA) to artifacts'

inputs:
  ecr-registry:
    description: 'ECR registry URL'
    required: true
  ecr-repository:
    description: 'ECR repository name'
    required: true
  image-tag:
    description: 'Image tag/version'
    required: true
  image-digest:
    description: 'Image digest from build output'
    required: true
  artifact-name:
    description: 'Name for the uploaded artifact'
    required: false
    default: 'build-metadata'

runs:
  using: 'composite'
  steps:
    - name: Generate metadata file
      shell: bash
      run: |
        mkdir -p build-artifacts

        URI="${{ inputs.ecr-registry }}/${{ inputs.ecr-repository }}"
        TAG="${{ inputs.image-tag }}"
        DIGEST="${{ inputs.image-digest }}"

        {
          echo "image_uri=$URI"
          echo "image_tag=$TAG"
          echo "image_digest=$DIGEST"
          echo "commit_sha=${{ github.sha }}"
          echo "commit_short_sha=${GITHUB_SHA:0:7}"
          echo "branch=${{ github.ref_name }}"
          echo "build_timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        } > build-artifacts/metadata.env

        jq -n \
          --arg uri "$URI" \
          --arg tag "$TAG" \
          --arg digest "$DIGEST" \
          --arg commit_sha "${{ github.sha }}" \
          --arg commit_short_sha "${GITHUB_SHA:0:7}" \
          --arg branch "${{ github.ref_name }}" \
          --arg build_timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
          '{
            uri: $uri,
            tag: $tag,
            digest: $digest,
            commit_sha: $commit_sha,
            commit_short_sha: $commit_short_sha,
            branch: $branch,
            build_timestamp: $build_timestamp
          }' > build-artifacts/metadata.json

        echo "Build metadata generated:"
        cat build-artifacts/metadata.env

    - name: Upload build metadata
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: build-artifacts/
        retention-days: 30
