apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "driver-service.name" . }}
  labels:
    {{- include "driver-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "driver-service.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "driver-service.name" . }}
    spec:
      serviceAccountName: {{ include "driver-service.name" . }}-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: {{ include "driver-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10001
            capabilities:
              drop:
                - ALL

          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: "/app/src"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "driver-service.name" . }}-secrets
                  key: database-url
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "driver-service.name" . }}-config
                  key: aws-region
            - name: SQS_TRIP_CREATED_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "driver-service.name" . }}-config
                  key: sqs-trip-created-url
            - name: SQS_DRIVER_ASSIGNED_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "driver-service.name" . }}-config
                  key: sqs-driver-assigned-url
            - name: SQS_TRIP_COMPLETED_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "driver-service.name" . }}-config
                  key: sqs-trip-completed-url
            - name: CLIENT_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "driver-service.name" . }}-config
                  key: client-gateway-url
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
