apiVersion: v1
kind: Service
metadata:
  name: {{ include "driver-service.name" . }}
  labels:
    {{- include "driver-service.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "driver-service.name" . }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: {{ .Values.service.type }}
