apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-service
  namespace: dev
  labels:
    app: driver-service
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driver-service
  template:
    metadata:
      labels:
        app: driver-service
        version: "1.0.0"
    spec:
      serviceAccountName: driver-service-sa
      imagePullSecrets:
        - name: ecr-registry-helper
      containers:
        - name: driver-service
          image: 969283154407.dkr.ecr.us-east-2.amazonaws.com/driver-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: "/app/src"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: driver-service-secrets
                  key: database-url
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: driver-service-config
                  key: aws-region
            - name: SQS_TRIP_CREATED_URL
              valueFrom:
                configMapKeyRef:
                  name: driver-service-config
                  key: sqs-trip-created-url
            - name: SQS_DRIVER_ASSIGNED_URL
              valueFrom:
                configMapKeyRef:
                  name: driver-service-config
                  key: sqs-driver-assigned-url
            - name: SQS_TRIP_COMPLETED_URL
              valueFrom:
                configMapKeyRef:
                  name: driver-service-config
                  key: sqs-trip-completed-url
            - name: CLIENT_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: driver-service-config
                  key: client-gateway-url
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
