services:
  # --- Shared Infrastructure ---
  
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: drive-ops-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${TRIP_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-db:/docker-entrypoint-initdb.d
    networks:
      - drive-ops-net

  # --- Microservices Stack ---

  # Database Migrations for Trip Service
  trip-migrations:
    build:
      context: ./trip-service
      dockerfile: Dockerfile.migrations
    container_name: trip-migrations
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - TRIP_DB_NAME=${TRIP_DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - drive-ops-net

  # Trip Service (Go)
  trip-service:
    build:
      context: ./trip-service
      dockerfile: Dockerfile
    container_name: trip-service
    restart: always
    env_file: .env
    environment:
      - AWS_REGION=us-east-2
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - SQS_DRIVER_ASSIGNED_URL=${SQS_DRIVER_ASSIGNED_URL}
      - SQS_TRIP_CREATED_URL=${SQS_TRIP_CREATED_URL}
      - SQS_TRIP_COMPLETED_URL=${SQS_TRIP_COMPLETED_URL}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      trip-migrations:
        condition: service_completed_successfully
    networks:
      - drive-ops-net

  # Database Migrations for Driver Service
  driver-migrations:
    build:
      context: ./driver-service
      dockerfile: Dockerfile.migrations
    container_name: driver-migrations
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DRIVER_DB_NAME=${DRIVER_DB_NAME}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DRIVER_DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - drive-ops-net

  # Driver Service (Python/FastAPI)
  driver-service:
    build:
      context: ./driver-service
      dockerfile: Dockerfile
    container_name: driver-service
    restart: always
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DRIVER_DB_NAME}
      - AWS_REGION=us-east-2
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - SQS_TRIP_CREATED_URL=${SQS_TRIP_CREATED_URL}
      - SQS_DRIVER_ASSIGNED_URL=${SQS_DRIVER_ASSIGNED_URL}
      - SQS_TRIP_COMPLETED_URL=${SQS_TRIP_COMPLETED_URL}
    ports:
      - "8082:8082" 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      driver-migrations:
        condition: service_completed_successfully
    networks:
      - drive-ops-net

  # Client Gateway (Telegram Bot)
  client-gateway:
    build:
      context: ./client-gateway
      dockerfile: Dockerfile
    container_name: client-gateway-bot
    restart: always
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8080:8080"
    depends_on:
      trip-service:
        condition: service_healthy
    networks:
      - drive-ops-net

  # Web Client (Static Dashboard — nginx)
  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: web-client
    restart: always
    environment:
      - DRIVER_SERVICE_URL=http://driver-service:8082
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      driver-service:
        condition: service_healthy
    networks:
      - drive-ops-net

# --- Infrastructure Definitions ---

networks:
  drive-ops-net:
    driver: bridge

volumes:
  postgres_data:
