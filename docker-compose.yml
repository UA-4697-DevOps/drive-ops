services:
  # --- Shared Infrastructure ---
  
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: drive-ops-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${TRIP_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-db:/docker-entrypoint-initdb.d
    networks:
      - drive-ops-net

  # [NEW] LocalStack for SQS Emulation
  localstack:
    image: localstack/localstack:latest
    container_name: drive-ops-localstack
    ports:
      - "4566:4566"            # SQS API Port
    environment:
      - SERVICES=sqs           # Only start SQS
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "./infra/localstack:/etc/localstack/init/ready.d" # [IMPORTANT] Scripts to create queues
    networks:
      - drive-ops-net

  # RabbitMQ Message Broker (Keep for legacy/other parts)
  mq:
    image: rabbitmq:3-management-alpine
    container_name: drive-ops-mq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - drive-ops-net

  # --- Microservices Stack ---

  # Database Migrations for Trip Service
  trip-migrations:
    build:
      context: ./trip-service
      dockerfile: Dockerfile.migrations
    container_name: trip-migrations
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - TRIP_DB_NAME=${TRIP_DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - drive-ops-net

  # Trip Service (Go)
  trip-service:
    build:
      context: ./trip-service
      dockerfile: Dockerfile
    container_name: trip-service
    restart: always
    env_file: .env
    environment:
      # [NEW] AWS / SQS Config for LocalStack
      - AWS_REGION=us-east-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/driver-assigned
      - SQS_ENDPOINT=http://localstack:4566 # This triggers the custom resolver in main.go
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      mq:
        condition: service_healthy
      localstack: # [NEW] Wait for SQS
        condition: service_started
      trip-migrations:
        condition: service_completed_successfully
    networks:
      - drive-ops-net

  # Database Migrations for Driver Service
  driver-migrations:
    build:
      context: ./driver-service
      dockerfile: Dockerfile.migrations
    container_name: driver-migrations
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DRIVER_DB_NAME=${DRIVER_DB_NAME}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DRIVER_DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - drive-ops-net

  # Driver Service (Python/FastAPI)
  driver-service:
    build:
      context: ./driver-service
      dockerfile: Dockerfile
    container_name: driver-service
    restart: always
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DRIVER_DB_NAME}
    ports:
      - "8082:8082" 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      mq:
        condition: service_healthy
      driver-migrations:
        condition: service_completed_successfully
    networks:
      - drive-ops-net

  # Client Gateway (Telegram Bot)
  client-gateway:
    build:
      context: ./client-gateway
      dockerfile: Dockerfile
    container_name: client-gateway-bot
    restart: always
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8080:8080"
    depends_on:
      trip-service:
        condition: service_healthy
    networks:
      - drive-ops-net

# --- Infrastructure Definitions ---

networks:
  drive-ops-net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
