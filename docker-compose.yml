services:
  db:
    image: postgres:15-alpine
    container_name: drive-ops-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${TRIP_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${TRIP_DB_NAME}"]
      interval: 5s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-db:/docker-entrypoint-initdb.d
    networks:
      - drive-ops-net

  mq:
    image: rabbitmq:3-management-alpine
    container_name: drive-ops-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - drive-ops-net

networks:
  drive-ops-net:
    name: drive-ops-net
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
