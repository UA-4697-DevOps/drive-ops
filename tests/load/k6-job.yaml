# ==============================================================================
# K6 LOAD TEST – Kubernetes Job
# ==============================================================================
# Runs the k6 load test script inside the cluster against the Trip Service.
#
# Prerequisites:
#   1. Create the ConfigMap with the test script:
#      kubectl create configmap k6-load-test \
#        --from-file=load-test.js=tests/load/load-test.js \
#        -n dev
#
#   2. Apply this Job:
#      kubectl apply -f tests/load/k6-job.yaml
#
#   3. Watch results:
#      kubectl logs -n dev -l job-name=k6-trip-service-load-test -f
# ==============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-trip-service-load-test
  namespace: dev
  labels:
    app: k6-load-test
    target: trip-service
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: k6-load-test
        target: trip-service
    spec:
      restartPolicy: Never
      containers:
      - name: k6
        image: grafana/k6:latest
        command: ["k6", "run", "/scripts/load-test.js"]
        env:
        - name: BASE_URL
          value: "http://trip-service.dev.svc.cluster.local"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: results
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: k6-load-test
      - name: results
        emptyDir: {}
